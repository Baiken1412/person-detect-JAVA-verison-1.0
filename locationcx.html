<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基于货架位置的人员活动轨迹查询</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background-color: #f5f7fa;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px 30px;
            border-radius: 8px 8px 0 0;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 500;
        }

        .header p {
            font-size: 14px;
            margin-top: 8px;
            opacity: 0.9;
        }

        .query-section {
            padding: 30px;
            border-bottom: 1px solid #e8e8e8;
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .form-group {
            flex: 1;
            min-width: 200px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #606266;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group label .required {
            color: #f56c6c;
            margin-right: 4px;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background-color: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background-color: #5568d3;
        }

        .btn-secondary {
            background-color: #f4f4f5;
            color: #606266;
        }

        .btn-secondary:hover {
            background-color: #e8e8e8;
        }

        .results-section {
            padding: 30px;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .results-header h2 {
            font-size: 18px;
            color: #303133;
            font-weight: 500;
        }

        .results-count {
            color: #909399;
            font-size: 14px;
        }

        .results-count .count {
            color: #667eea;
            font-weight: 600;
            font-size: 16px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #909399;
        }

        .empty-state svg {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 14px;
        }

        .trajectory-list {
            display: grid;
            gap: 20px;
        }

        .trajectory-card {
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s;
        }

        .trajectory-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            border-color: #667eea;
        }

        .trajectory-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
        }

        .trajectory-id {
            font-size: 16px;
            font-weight: 600;
            color: #303133;
        }

        .trajectory-time {
            color: #909399;
            font-size: 13px;
        }

        .trajectory-content {
            display: grid;
            grid-template-columns: 250px 1fr 450px;
            gap: 20px;
        }

        .trajectory-right {
            display: flex;
            flex-direction: column;
        }

        .trajectory-image {
            position: relative;
        }

        .trajectory-image img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 6px;
            background-color: #f5f7fa;
        }

        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            opacity: 0;
            transition: opacity 0.3s;
            cursor: pointer;
        }

        .trajectory-image:hover .play-overlay {
            opacity: 1;
        }

        .play-button {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .play-button svg {
            width: 24px;
            height: 24px;
            fill: #667eea;
            margin-left: 4px;
        }

        .trajectory-info {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .info-row {
            display: flex;
            align-items: flex-start;
            font-size: 14px;
        }

        .info-label {
            min-width: 100px;
            color: #606266;
            font-weight: 500;
        }

        .info-value {
            color: #303133;
            flex: 1;
        }

        .tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            margin-right: 8px;
            margin-bottom: 4px;
        }

        .tag-location {
            background-color: #ecf5ff;
            color: #409eff;
        }

        .tag-camera {
            background-color: #f0f9ff;
            color: #67c23a;
        }

        .duration-badge {
            display: inline-block;
            padding: 2px 8px;
            background-color: #f4f4f5;
            border-radius: 3px;
            font-size: 13px;
            color: #909399;
        }

        .video-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            border: 1px solid #dcdfe6;
            background-color: white;
            color: #606266;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-small:hover {
            color: #667eea;
            border-color: #667eea;
        }

        .video-screenshots {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .screenshots-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid #e8e8e8;
        }

        .screenshots-title {
            font-size: 13px;
            color: #606266;
            font-weight: 500;
        }

        .screenshots-count {
            font-size: 12px;
            color: #909399;
        }

        .screenshots-scroll {
            overflow-x: auto;
            overflow-y: hidden;
            display: flex;
            flex-direction: row;
            gap: 12px;
            padding-bottom: 10px;
        }

        .screenshots-scroll::-webkit-scrollbar {
            height: 6px;
        }

        .screenshots-scroll::-webkit-scrollbar-track {
            background: #f5f7fa;
            border-radius: 3px;
        }

        .screenshots-scroll::-webkit-scrollbar-thumb {
            background: #dcdfe6;
            border-radius: 3px;
        }

        .screenshots-scroll::-webkit-scrollbar-thumb:hover {
            background: #c0c4cc;
        }

        .screenshot-item {
            position: relative;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
            flex-shrink: 0;
            width: 200px;
        }

        .screenshot-item:hover {
            border-color: #667eea;
            transform: translateY(-4px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .screenshot-item img {
            width: 200px;
            height: 150px;
            object-fit: cover;
            display: block;
            background-color: #f5f7fa;
        }

        .screenshot-time {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7), transparent);
            color: white;
            font-size: 11px;
            padding: 8px 8px 6px;
            text-align: center;
        }

        .screenshot-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            background-color: rgba(102, 126, 234, 0.9);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 500;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #909399;
        }

        .loading::after {
            content: "加载中...";
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0%, 100% { content: "加载中..."; }
            33% { content: "加载中.."; }
            66% { content: "加载中."; }
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e8e8e8;
        }

        .pagination button {
            padding: 8px 12px;
            border: 1px solid #dcdfe6;
            background-color: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .pagination button:hover:not(:disabled) {
            color: #667eea;
            border-color: #667eea;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination .page-info {
            margin: 0 12px;
            color: #606266;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 页面标题 -->
        <div class="header">
            <h1>基于货架位置的人员活动轨迹查询</h1>
            <p>通过货架位置查询人员活动相关的视频记录，支持查看轨迹关键帧截图、活动时间段及视频片段</p>
        </div>

        <!-- 查询条件区域 -->
        <div class="query-section">
            <form id="queryForm">
                <div class="form-row">
                    <div class="form-group">
                        <label><span class="required">*</span>货架位置</label>
                        <select id="locationSelect" required>
                            <option value="">请选择货架位置</option>
                            <option value="1">A01-03-02 - 东区货架A组</option>
                            <option value="2">A01-03-03 - 东区货架B组</option>
                            <option value="3">A02-01-05 - 西区货架C组</option>
                            <option value="4">B01-02-01 - 北区货架D组</option>
                            <option value="5">B01-02-02 - 北区货架E组</option>
                            <option value="6">C01-01-03 - 南区货架F组</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>所属区域（库区）</label>
                        <select id="areaSelect">
                            <option value="">全部区域</option>
                            <option value="A区">A区</option>
                            <option value="B区">B区</option>
                            <option value="C区">C区</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label><span class="required">*</span>开始时间</label>
                        <input type="datetime-local" id="startTime" required>
                    </div>
                    <div class="form-group">
                        <label><span class="required">*</span>结束时间</label>
                        <input type="datetime-local" id="endTime" required>
                    </div>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary">
                        <span>查询轨迹</span>
                    </button>
                    <button type="reset" class="btn btn-secondary">重置</button>
                </div>
            </form>
        </div>

        <!-- 查询结果区域 -->
        <div class="results-section">
            <div class="results-header">
                <h2>查询结果</h2>
                <div class="results-count">
                    共找到 <span class="count" id="resultCount">0</span> 条轨迹记录
                </div>
            </div>

            <!-- 空状态 -->
            <div class="empty-state" id="emptyState">
                <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
                    <path d="M512 128C300.8 128 128 300.8 128 512s172.8 384 384 384 384-172.8 384-384S723.2 128 512 128z m0 704c-176.448 0-320-143.552-320-320s143.552-320 320-320 320 143.552 320 320-143.552 320-320 320z" fill="currentColor"/>
                    <path d="M512 288c-17.664 0-32 14.336-32 32v224c0 17.664 14.336 32 32 32s32-14.336 32-32V320c0-17.664-14.336-32-32-32zM512 640c-17.664 0-32 14.336-32 32v32c0 17.664 14.336 32 32 32s32-14.336 32-32v-32c0-17.664-14.336-32-32-32z" fill="currentColor"/>
                </svg>
                <p>请选择查询条件后点击"查询轨迹"按钮开始查询</p>
            </div>

            <!-- 加载状态 -->
            <div class="loading" id="loadingState" style="display: none;"></div>

            <!-- 轨迹列表 -->
            <div class="trajectory-list" id="trajectoryList" style="display: none;">
                <!-- 轨迹卡片将通过JavaScript动态生成 -->
            </div>

            <!-- 分页 -->
            <div class="pagination" id="pagination" style="display: none;">
                <button id="prevPage">上一页</button>
                <span class="page-info">第 <span id="currentPage">1</span> / <span id="totalPages">1</span> 页</span>
                <button id="nextPage">下一页</button>
            </div>
        </div>
    </div>

    <script>
        // 模拟数据
        const mockData = {
            trajectories: [
                {
                    id: 'TJ20251230001',
                    locationCode: 'A01-03-02',
                    locationName: '东区货架A组',
                    areaName: 'A区',
                    cameraName: '摄像头01',
                    startTime: '2025-12-30 09:15:23',
                    endTime: '2025-12-30 09:18:45',
                    duration: '3分22秒',
                    keyframeUrl: 'https://via.placeholder.com/250x180/667eea/ffffff?text=关键帧+1',
                    hasVideo: true,
                    videoCount: 2,
                    screenshots: [
                        { url: 'https://via.placeholder.com/200x150/667eea/ffffff?text=截图+1', time: '09:15:23', index: 1 },
                        { url: 'https://via.placeholder.com/200x150/7c8aed/ffffff?text=截图+2', time: '09:16:05', index: 2 },
                        { url: 'https://via.placeholder.com/200x150/9296f0/ffffff?text=截图+3', time: '09:16:47', index: 3 },

                        { url: 'https://via.placeholder.com/200x150/beaef6/ffffff?text=截图+5', time: '09:18:11', index: 5 },
                        { url: 'https://via.placeholder.com/200x150/d4baf9/ffffff?text=截图+6', time: '09:18:45', index: 6 }
                    ]
                },
                {
                    id: 'TJ20251230002',
                    locationCode: 'A01-03-02',
                    locationName: '东区货架A组',
                    areaName: 'A区',
                    cameraName: '摄像头02',
                    startTime: '2025-12-30 10:22:11',

                    keyframeUrl: 'https://via.placeholder.com/250x180/764ba2/ffffff?text=关键帧+2',
                    hasVideo: true,

                    screenshots: [
                        { url: 'https://via.placeholder.com/200x150/764ba2/ffffff?text=截图+1', time: '10:22:11', index: 1 },
                        { url: 'https://via.placeholder.com/200x150/8a5fb5/ffffff?text=截图+2', time: '10:23:08', index: 2 },
                        { url: 'https://via.placeholder.com/200x150/9e73c8/ffffff?text=截图+3', time: '10:24:05', index: 3 },
                        { url: 'https://via.placeholder.com/200x150/b287db/ffffff?text=截图+4', time: '10:25:33', index: 4 }
                    ]
                },
                {
                    id: 'TJ20251230003',
                    locationCode: 'A01-03-02',
                    locationName: '东区货架A组',
                    areaName: 'A区',
                    cameraName: '摄像头01',
                    startTime: '2025-12-30 14:33:08',
                    endTime: '2025-12-30 14:38:52',
                    duration: '5分44秒',
                    keyframeUrl: 'https://via.placeholder.com/250x180/f093fb/ffffff?text=关键帧+3',
                    hasVideo: true,
                    videoCount: 3,
                    screenshots: [
                        { url: 'https://via.placeholder.com/200x150/f093fb/ffffff?text=截图+1', time: '14:33:08', index: 1 },
                        { url: 'https://via.placeholder.com/200x150/f2a0fb/ffffff?text=截图+2', time: '14:34:15', index: 2 },
                        { url: 'https://via.placeholder.com/200x150/f4adfc/ffffff?text=截图+3', time: '14:35:22', index: 3 },
                        { url: 'https://via.placeholder.com/200x150/f6bafc/ffffff?text=截图+4', time: '14:36:29', index: 4 },
                        { url: 'https://via.placeholder.com/200x150/f8c7fd/ffffff?text=截图+5', time: '14:37:36', index: 5 },
                        { url: 'https://via.placeholder.com/200x150/fad4fd/ffffff?text=截图+6', time: '14:38:52', index: 6 }
                    ]
                },
                {
                    id: 'TJ20251230004',
                    locationCode: 'A01-03-02',
                    locationName: '东区货架A组',
                    areaName: 'A区',
                    cameraName: '摄像头03',
                    startTime: '2025-12-30 16:45:30',
                    endTime: '2025-12-30 16:47:15',
                    duration: '1分45秒',
                    keyframeUrl: 'https://via.placeholder.com/250x180/4facfe/ffffff?text=关键帧+4',
                    hasVideo: true,
                    videoCount: 1,
                    screenshots: [
                        { url: 'https://via.placeholder.com/200x150/4facfe/ffffff?text=截图+1', time: '16:45:30', index: 1 },
                        { url: 'https://via.placeholder.com/200x150/64b8fe/ffffff?text=截图+2', time: '16:46:05', index: 2 },
                        { url: 'https://via.placeholder.com/200x150/79c4fe/ffffff?text=截图+3', time: '16:46:40', index: 3 },
                        { url: 'https://via.placeholder.com/200x150/8ed0ff/ffffff?text=截图+4', time: '16:47:15', index: 4 }
                    ]
                }
            ]
        };

        // DOM元素
        const queryForm = document.getElementById('queryForm');
        const emptyState = document.getElementById('emptyState');
        const loadingState = document.getElementById('loadingState');
        const trajectoryList = document.getElementById('trajectoryList');
        const resultCount = document.getElementById('resultCount');
        const pagination = document.getElementById('pagination');

        // 设置默认时间
        function initDateTime() {
            const now = new Date();
            const endTime = document.getElementById('endTime');
            endTime.value = formatDateTime(now);

            const startDate = new Date(now.getTime() - 24 * 60 * 60 * 1000);
            const startTime = document.getElementById('startTime');
            startTime.value = formatDateTime(startDate);
        }

        function formatDateTime(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${year}-${month}-${day}T${hours}:${minutes}`;
        }

        // 渲染轨迹列表
        function renderTrajectories(data) {
            trajectoryList.innerHTML = '';

            data.forEach(trajectory => {
                const card = document.createElement('div');
                card.className = 'trajectory-card';

                // 生成截图HTML
                let screenshotsHtml = '';
                if (trajectory.screenshots && trajectory.screenshots.length > 0) {
                    screenshotsHtml = trajectory.screenshots.map(screenshot => `
                        <div class="screenshot-item" onclick="viewScreenshot('${trajectory.id}', ${screenshot.index})">
                            <img src="${screenshot.url}" alt="视频截图 ${screenshot.index}">
                            <div class="screenshot-badge">#${screenshot.index}</div>
                            <div class="screenshot-time">${screenshot.time}</div>
                        </div>
                    `).join('');
                }

                card.innerHTML = `
                    <div class="trajectory-header">
                        <div class="trajectory-id">轨迹编号: ${trajectory.id}</div>
                        <div class="trajectory-time">
                            ${trajectory.startTime} - ${trajectory.endTime}
                        </div>
                    </div>
                    <div class="trajectory-content">
                        <div class="trajectory-image">
                            <img src="${trajectory.keyframeUrl}" alt="关键帧截图">
                            <div class="play-overlay" onclick="playVideo('${trajectory.id}')">
                                <div class="play-button">
                                    <svg viewBox="0 0 24 24">
                                        <path d="M8 5v14l11-7z"/>
                                    </svg>
                                </div>
                            </div>
                        </div>
                        <div class="trajectory-info">
                            <div class="info-row">
                                <div class="info-label">货架位置:</div>
                                <div class="info-value">
                                    <span class="tag tag-location">${trajectory.locationCode}</span>
                                    ${trajectory.locationName}
                                </div>
                            </div>
                            <div class="info-row">
                                <div class="info-label">所属区域:</div>
                                <div class="info-value">${trajectory.areaName}</div>
                            </div>
                            <div class="info-row">
                                <div class="info-label">关联摄像头:</div>
                                <div class="info-value">
                                    <span class="tag tag-camera">${trajectory.cameraName}</span>
                                </div>
                            </div>
                            <div class="info-row">
                                <div class="info-label">活动时长:</div>
                                <div class="info-value">
                                    <span class="duration-badge">${trajectory.duration}</span>
                                </div>
                            </div>
                            <div class="info-row">
                                <div class="info-label">视频片段:</div>
                                <div class="info-value">
                                    ${trajectory.hasVideo ? `共 ${trajectory.videoCount} 个视频片段` : '暂无视频'}
                                    <div class="video-actions">
                                        <button class="btn-small" onclick="playVideo('${trajectory.id}')">播放视频</button>
                                        
                                        <button class="btn-small" onclick="viewDetails('${trajectory.id}')">查看事件</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="trajectory-right">
                            <div class="video-screenshots">
                                <div class="screenshots-header">
                                    <div class="screenshots-title">视频截图时间轴</div>
                                    <div class="screenshots-count">${trajectory.screenshots ? trajectory.screenshots.length : 0} 张</div>
                                </div>
                                <div class="screenshots-scroll">
                                    ${screenshotsHtml}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                trajectoryList.appendChild(card);
            });
        }

        // 处理查询表单提交
        queryForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const locationId = document.getElementById('locationSelect').value;
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;

            if (!locationId || !startTime || !endTime) {
                alert('请填写完整的查询条件');
                return;
            }

            // 显示加载状态
            emptyState.style.display = 'none';
            trajectoryList.style.display = 'none';
            pagination.style.display = 'none';
            loadingState.style.display = 'block';

            // 模拟异步查询
            setTimeout(() => {
                loadingState.style.display = 'none';

                // 显示结果
                if (mockData.trajectories.length > 0) {
                    renderTrajectories(mockData.trajectories);
                    resultCount.textContent = mockData.trajectories.length;
                    trajectoryList.style.display = 'grid';
                    pagination.style.display = 'flex';
                } else {
                    emptyState.querySelector('p').textContent = '未找到符合条件的轨迹记录';
                    emptyState.style.display = 'block';
                    resultCount.textContent = '0';
                }
            }, 1000);
        });

        // 重置表单
        queryForm.addEventListener('reset', function() {
            setTimeout(() => {
                initDateTime();
                emptyState.querySelector('p').textContent = '请选择查询条件后点击"查询轨迹"按钮开始查询';
                emptyState.style.display = 'block';
                trajectoryList.style.display = 'none';
                pagination.style.display = 'none';
                resultCount.textContent = '0';
            }, 0);
        });

        // 视频播放功能
        function playVideo(trajectoryId) {
            alert(`播放轨迹 ${trajectoryId} 的视频片段`);
            // 实际实现中可以打开视频播放器弹窗
        }

        // 下载视频功能
        function downloadVideo(trajectoryId) {
            alert(`下载轨迹 ${trajectoryId} 的视频片段`);
            // 实际实现中触发视频下载
        }

        // 查看详情功能
        function viewDetails(trajectoryId) {
            alert(`查看轨迹 ${trajectoryId} 的详细信息`);
            // 实际实现中可以打开详情弹窗或跳转到详情页
        }

        // 查看截图功能
        function viewScreenshot(trajectoryId, screenshotIndex) {
            alert(`查看轨迹 ${trajectoryId} 的第 ${screenshotIndex} 张截图`);
            // 实际实现中可以打开图片预览弹窗，支持左右切换
        }

        // 分页功能
        document.getElementById('prevPage').addEventListener('click', function() {
            alert('上一页功能');
        });

        document.getElementById('nextPage').addEventListener('click', function() {
            alert('下一页功能');
        });

        // 区域选择联动（可选）
        document.getElementById('areaSelect').addEventListener('change', function() {
            const area = this.value;
            const locationSelect = document.getElementById('locationSelect');
            // 实际实现中可以根据区域过滤位置选项
        });

        // 页面加载时初始化
        initDateTime();
    </script>
</body>
</html>

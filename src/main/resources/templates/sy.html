        // 导出选中的事件包
        function exportSelectedEventPackages() {
            const checkboxes = document.querySelectorAll('.composite-checkbox:checked');

            if (checkboxes.length === 0) {
                alert('请先选择要导出的复合事件');
                return;
            }

            // 获取选中的事件ID列表（过滤无效值）
            const selectedEventIds = Array.from(checkboxes)
                .map(cb => cb.getAttribute('data-event-id'))
                .filter(id => id && id.trim() !== '');

            if (selectedEventIds.length === 0) {
                alert('未找到有效的事件ID');
                return;
            }

            // 确认导出
            if (!confirm(`确定要导出选中的 ${selectedEventIds.length} 个事件包吗？\n\n导出位置：桌面/事件包导出/batch_events_[时间]/\n包含：HTML报告、图片、视频、JSON数据\n\n💡 提示：如需选择保存位置，请在浏览器设置中开启\n"下载前询问每个文件的保存位置"选项`)) {
                return;
            }

            // 显示加载提示
            const loadingMsg = document.createElement('div');
            loadingMsg.innerHTML = `⏳ 正在导出事件包，请稍候...<br><small>共 ${selectedEventIds.length} 个事件</small>`;
            loadingMsg.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: white; padding: 20px 40px; border-radius: 8px; z-index: 9999; font-size: 16px; text-align: center;';
            document.body.appendChild(loadingMsg);

            // 调用批量导出接口
            fetch('/caseapp/track/compositeEvents/batchExport', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: 'eventIds=' + encodeURIComponent(selectedEventIds.join(','))
            })
            .then(response => response.json())
            .then(data => {
                if (loadingMsg.parentNode) {
                    document.body.removeChild(loadingMsg);
                }
                if (data.code === 0) {
                    // 下载ZIP文件
                    const fileName = encodeURI(data.msg);
                    window.location.href = ctx + 'common/download?fileName=' + fileName + '&delete=true';
                    alert('✅ 导出成功！正在下载事件包...');

                    // 取消选中
                    checkboxes.forEach(cb => cb.checked = false);
                } else {
                    alert('❌ 导出失败：' + data.msg);
                }
            })
            .catch(error => {
                if (loadingMsg.parentNode) {
                    document.body.removeChild(loadingMsg);
                }
                console.error('导出事件包失败:', error);
                alert('❌ 导出失败：' + error);
            });
        }

        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', init);

        // ==================== 复合事件标注功能 ====================
        let currentAnnotationEventId = null;
        let currentAnnotationCompId = null;

        // 打开复合事件标注弹窗
        function annotateCompositeEvent(eventId, compId) {
            currentAnnotationEventId = eventId;
            currentAnnotationCompId = compId;

            // 显示模态框
            document.getElementById('compositeAnnotationModal').style.display = 'flex';

            // 重置表单
            document.getElementById('annotationForm').reset();

            // 加载人员列表并初始化 Select2
            loadPersonListForAnnotation();
        }

        // 加载人员列表供标注使用
        function loadPersonListForAnnotation() {
            fetch('/caseapp/person/persons', {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                const personSelect = $('#annot_ryxm');

                // 如果 select2 已经初始化，先销毁
                if (personSelect.data('select2')) {
                    personSelect.select2('destroy');
                }

                // 清空现有选项
                personSelect.empty();

                // 添加选项
                if (data && data.data) {
                    data.data.forEach(person => {
                        personSelect.append(new Option(person, person, false, false));
                    });
                }

                // 初始化 Select2（多选下拉框，显示为标签形式）
                personSelect.select2({
                    placeholder: '请选择管理员（可多选）',
                    allowClear: true,
                    width: '100%',
                    dropdownParent: $('#compositeAnnotationModal'),
                    language: {
                        noResults: function() {
                            return "未找到匹配的管理员";
                        }
                    }
                });

                // 美化 Select2 多选框，让它看起来更像下拉框
                setTimeout(function() {
                    const $container = $('#annot_ryxm').next('.select2-container');
                    const $selection = $container.find('.select2-selection');

                    // 添加边框和样式，与"行为原因"下拉框保持一致
                    $selection.css({
                        'border': '2px solid #dee2e6',
                        'border-radius': '4px',
                        'min-height': '38px',
                        'padding': '10px 30px 10px 10px',
                        'background': 'white',
                        'position': 'relative',
                        'cursor': 'pointer',
                        'font-size': '14px',
                        'font-weight': 'bold'
                    });

                    // 移除输入框的文字光标，并设置字体加粗
                    $selection.find('.select2-search__field').css({
                        'cursor': 'pointer',
                        'font-weight': 'bold'
                    });

                    // 设置 placeholder 文字颜色为深黑色
                    $selection.find('.select2-search__field').attr('placeholder', '请选择管理员（可多选）');
                    $selection.find('.select2-search__field').css('color', '#333');

                    // 设置选中项的字体加粗
                    $selection.find('.select2-selection__choice').css('font-weight', 'bold');

                    // 如果还没有下拉箭头，添加一个（更大、更黑）
                    if ($selection.find('.custom-arrow').length === 0) {
                        $selection.append('<span class="custom-arrow" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; color: #333; font-size: 16px; font-weight: bold;">▼</span>');
                    }

                    // 鼠标悬停效果
                    $selection.hover(
                        function() { $(this).css('border-color', '#4c6ef5'); },
                        function() { $(this).css('border-color', '#dee2e6'); }
                    );
                }, 100);
            })
            .catch(error => {
                console.error('加载人员列表失败:', error);
            });
        }

        // 关闭标注弹窗
        function closeAnnotationModal() {
            document.getElementById('compositeAnnotationModal').style.display = 'none';
            // 清空表单
            document.getElementById('annot_xwyy').value = '';
            // 使用 Select2 的方式清空人员选择
            $('#annot_ryxm').val(null).trigger('change');
            document.getElementById('annot_wlry').value = '';
            document.getElementById('annot_remark').value = '';
            currentAnnotationEventId = null;
            currentAnnotationCompId = null;
        }

        // 保存复合事件标注
        function saveCompositeAnnotation() {
            const xwyy = document.getElementById('annot_xwyy').value;
            // 从多选下拉框获取选中的人员，用逗号连接
            const ryxmArray = $('#annot_ryxm').val();
            const ryxm = ryxmArray ? ryxmArray.join(',') : '';
            const wlry = document.getElementById('annot_wlry').value;
            const remark = document.getElementById('annot_remark').value;

            if (!xwyy) {
                alert('请选择行为原因');
                return;
            }

            // 构建请求数据
            const formData = new FormData();
            formData.append('eventId', currentAnnotationEventId);
            formData.append('xwyy', xwyy);
            formData.append('ryxm', ryxm);
            formData.append('wlry', wlry);
            formData.append('remark', remark);

            // 发送标注请求
            fetch('/caseapp/track/annotateCompositeEvent', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.code === 0) {
                    alert('✅ 标注成功！');
                    closeAnnotationModal();
                    // 重新加载复合事件列表
                    analyzeCompositeEvents();
                } else {
                    alert('❌ 标注失败：' + data.msg);
                }
            })
            .catch(error => {
                console.error('标注失败:', error);
                alert('❌ 标注失败：' + error);
            });
        }
    </script>

    <!-- 复合事件标注模态框 -->
    <div id="compositeAnnotationModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center;">
        <div style="background: white; border-radius: 8px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.3);">
            <!-- 标题 -->
            <div style="background: linear-gradient(135deg, #4c6ef5 0%, #364fc7 100%); color: white; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center;">
                <h2 style="margin: 0; font-size: 20px;">✏️ 标注复合事件</h2>
                <button onclick="closeAnnotationModal()" style="background: rgba(255,255,255,0.2); border: none; color: white; font-size: 24px; width: 36px; height: 36px; border-radius: 50%; cursor: pointer;">×</button>
            </div>

            <!-- 表单内容 -->
            <div style="padding: 30px;">
                <form id="annotationForm">
                    <!-- 行为原因 -->
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: bold; color: #333;">
                            <span style="color: #ff6b6b;">*</span> 行为原因：
                        </label>
                        <select id="annot_xwyy" style="width: 100%; padding: 10px; border: 2px solid #dee2e6; border-radius: 4px; font-size: 14px;">
                            <option value="">请选择行为原因</option>
                            <option value="盘库">盘库</option>
                            <option value="入库物品">入库物品</option>
                            <option value="出库物品">出库物品</option>
                            <option value="巡查">巡查</option>
                            <option value="整理">整理</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>

                    <!-- 人员姓名 -->
                    <div id="annot_ryxm_container" style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: bold; color: #333;">
                            👤 管理员姓名：
                        </label>
                        <select id="annot_ryxm" class="form-control" multiple style="width: 100%; display: block !important; visibility: visible !important;">
                            <option value="">加载中...</option>
                        </select>
                        <small style="color: #868e96; font-size: 12px;">可多选，选中后会显示为标签</small>
                    </div>

                    <!-- 外来人员 -->
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: bold; color: #333;">
                            🔶 外来人员：
                        </label>
                        <input type="text" id="annot_wlry" placeholder="多个人员用逗号分隔" style="width: 100%; padding: 10px; border: 2px solid #dee2e6; border-radius: 4px; font-size: 14px;">
                        <small style="color: #868e96; font-size: 12px;">如有外来人员参与，请填写</small>
                    </div>

                    <!-- 备注 -->
                    <div style="margin-bottom: 20px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: bold; color: #333;">
                            📝 备注：
                        </label>
                        <textarea id="annot_remark" placeholder="请输入备注信息" style="width: 100%; padding: 10px; border: 2px solid #dee2e6; border-radius: 4px; font-size: 14px; min-height: 80px; resize: vertical;"></textarea>
                        <small style="color: #868e96; font-size: 12px;">可选填，用于记录其他需要说明的信息</small>
                    </div>

                    <!-- 按钮 -->
                    <div style="display: flex; gap: 10px; margin-top: 30px;">
                        <button type="button" onclick="closeAnnotationModal()" style="flex: 1; padding: 12px; background: #868e96; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">
                            取消
                        </button>
                        <button type="button" onclick="saveCompositeAnnotation()" style="flex: 2; padding: 12px; background: #4c6ef5; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold;">
                            ✅ 保存标注
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <th:block th:include="include :: footer" />
    <th:block th:include="include :: select2-js" />
    <th:block th:include="include :: bootstrap-select-js" />
</body>
</html>

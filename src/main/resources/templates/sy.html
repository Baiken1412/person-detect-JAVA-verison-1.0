<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资产视频分析插件</title>
    <th:block th:include="include :: select2-css" />
    <th:block th:include="include :: bootstrap-select-css" />
    <link th:href="@{/css/button-animations.css}" rel="stylesheet"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        .header {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            color: white;
            padding: 40px 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            border-radius: 50%;
        }

        .header-content {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-logo {
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        .header-logo img {
            height: 80px;
            width: auto;
            mix-blend-mode: multiply;
        }

        .header-text h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header-text p {
            font-size: 16px;
            opacity: 0.95;
            letter-spacing: 1px;
        }

        .footer {
            background: #2c3e50;
            color: #ecf0f1;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            font-size: 14px;
        }

        .footer a {
            color: #3498db;
            text-decoration: none;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 4px solid #2a5298;
        }

        .stat-card h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .stat-card .number {
            font-size: 28px;
            font-weight: bold;
            color: #2a5298;
        }

        .toolbar {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }

        .toolbar > div {
            display: flex;
            align-items: center;
        }

        /* 调整工具栏各筛选框的宽度 */
        .toolbar > div:nth-child(2) { min-width: 250px; } /* 区域 */
        .toolbar > div:nth-child(3) { min-width: 180px; } /* 状态 */
        .toolbar > div:nth-child(4) { min-width: 220px; } /* 原因 (多选) */
        .toolbar > div:nth-child(5) { min-width: 200px; } /* 管理员 */
        .toolbar > div:nth-child(6) { min-width: 200px; } /* 特殊筛选 */

        .toolbar label {
            font-size: 14px;
            color: #666;
            margin-right: 8px;
            white-space: nowrap;
        }

        .toolbar input[type="date"],
        .toolbar select {
            padding: 8px 12px;
            border: 2px solid #dee2e6;
            border-radius: 4px;
            font-size: 14px;
            font-weight: normal;
            color: #333;
            background: white;
            min-height: 38px;
        }

        .toolbar input[type="date"]::placeholder,
        .toolbar select::placeholder {
            color: #999;
            font-size: 14px;
            font-weight: normal;
        }

        .toolbar .select2-container {
            vertical-align: middle;
        }

        /* 统一所有筛选框的样式 */
        .toolbar .select2-selection {
            height: auto !important;
            min-height: 38px !important;
            display: flex !important;
            align-items: center !important;
            border: 2px solid #dee2e6 !important;
            border-radius: 4px !important;
            padding: 5px 10px !important;
            background: white !important;
            font-size: 14px !important;
            font-weight: normal !important;
        }

        .toolbar .select2-selection__rendered {
            line-height: 38px !important;
            font-size: 14px !important;
            font-weight: normal !important;
            color: #333 !important;
        }

        .toolbar .select2-selection__placeholder {
            color: #999 !important;
            font-size: 14px !important;
            font-weight: normal !important;
        }

        .toolbar .select2-selection__choice {
            font-size: 13px !important;
            font-weight: normal !important;
        }

        .toolbar .select2-search__field {
            font-size: 14px !important;
            font-weight: normal !important;
            color: #333 !important;
        }

        .toolbar .select2-selection--single .select2-selection__rendered {
            padding-left: 0 !important;
        }

        .toolbar .select2-selection--multiple .select2-selection__rendered {
            padding-left: 0 !important;
        }

        /* 下拉选项样式统一 */
        .select2-dropdown {
            border: 2px solid #dee2e6 !important;
            border-radius: 4px !important;
        }

        .select2-results__option {
            font-size: 14px !important;
            font-weight: normal !important;
            color: #333 !important;
            padding: 8px 12px !important;
        }

        .select2-results__option--highlighted {
            background-color: #e7f3ff !important;
            color: #333 !important;
        }

        .select2-results__option--selected {
            background-color: #d4e9ff !important;
            color: #333 !important;
        }

        /* 标注模态框中的 Select2 样式 */
        #compositeAnnotationModal .select2-container--default .select2-selection--multiple {
            border: 2px solid #dee2e6 !important;
            border-radius: 4px !important;
            min-height: 42px !important;
            padding: 5px 10px !important;
            background: white !important;
            position: relative !important;
        }

        #compositeAnnotationModal .select2-container--default .select2-selection--multiple::after {
            content: '▼';
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #868e96;
            font-size: 12px;
        }

        #compositeAnnotationModal .select2-container--default .select2-selection--multiple:hover {
            border-color: #4c6ef5 !important;
        }

        #compositeAnnotationModal .select2-search__field::placeholder {
            color: #333 !important;
            opacity: 1 !important;
        }

        .toolbar button {
            padding: 8px 20px;
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: normal;
            min-height: 38px;
        }

        .toolbar button:hover {
            background: #1e3c72;
        }

        .loading-tip {
            text-align: center;
            padding: 20px;
            color: #999;
            grid-column: 1 / -1;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #2a5298;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== Composite Events ===== */
        .composite-section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .composite-section h2 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #2a5298;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .composite-card {
            background: white;
            border: 2px solid #9775fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .composite-card:hover {
            background: #f3f0ff;
            box-shadow: 0 4px 12px rgba(151,117,250,0.2);
        }

        .composite-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .composite-title {
            font-weight: bold;
            color: #9775fa;
            font-size: 16px;
        }

        .composite-badge {
            background: #9775fa;
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
        }

        .composite-path {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .composite-time-range {
            color: #999;
            font-size: 13px;
        }

        /* ===== Pagination Styles ===== */
        .pagination-container {
            display: flex;
            justify-content: center;
            margin-top: 30px;
            padding-bottom: 10px;
        }

        .pagination {
            display: flex;
            list-style: none;
            padding: 0;
            margin: 0;
            gap: 5px;
            align-items: center;
        }

        .page-item .page-link {
            padding: 8px 14px;
            border: 1px solid #dee2e6;
            background: white;
            color: #2a5298;
            text-decoration: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            font-weight: 500;
        }

        .page-item.active .page-link {
            background: #2a5298;
            color: white;
            border-color: #2a5298;
        }

        .page-item.disabled .page-link {
            color: #999;
            cursor: not-allowed;
            background: #f8f9fa;
            border-color: #e9ecef;
        }

        .page-item .page-link:hover:not(.disabled):not(.active) {
            background-color: #e2e6ea;
            border-color: #dae0e5;
            color: #1e3c72;
        }

        /* 退出登录按钮样式 */
        .logout-button {
            background: #ff9800 !important;
            border: 1px solid #ff9800 !important;
            color: white !important;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 2px 4px rgba(255, 152, 0, 0.3);
        }

        .logout-button:hover {
            background: #f57c00 !important;
            border-color: #f57c00 !important;
            box-shadow: 0 4px 8px rgba(255, 152, 0, 0.4);
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            .header { padding: 30px 20px; }
            .header-content { flex-direction: column; text-align: center; }
            .header-logo img { height: 60px; }
            .header-text h1 { font-size: 24px; }
            .header-text p { font-size: 14px; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .toolbar > * { width: 100%; }
            .modal-content { width: 95%; }
        }
    </style>
</head>
<body>
<div class="header">
    <div class="header-content">
        <div class="header-logo"><img src="/图片1.png" alt="系统Logo"></div>
        <div class="header-text">
            <h1 id="systemTitle">资产视频分析插件</h1>
            <p id="systemSubtitle">人员活动自动识别与追溯管理系统</p>
        </div>
        <div style="margin-left: auto; display: flex; gap: 10px;">
            <button style="background: rgba(255,255,255,0.4); border: 1px solid white; color: white; padding: 10px 20px; border-radius: 4px; cursor: default; font-size: 14px; font-weight: bold;">
                🏠 事件页面
            </button>
            <button onclick="goToEventList()" style="background: rgba(255,255,255,0.2); border: 1px solid white; color: white; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; transition: background 0.3s;">
                📝 轨迹页面
            </button>
            <button onclick="goToDailyReport()" style="background: rgba(255,255,255,0.2); border: 1px solid white; color: white; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; transition: background 0.3s;">
                📊 每日报告
            </button>
            <button onclick="goToShelfTrajectory()" style="background: rgba(255,255,255,0.2); border: 1px solid white; color: white; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; transition: background 0.3s;">
                📦 货位位置查询
            </button>
            <a th:href="@{/logout}" class="logout-button">
                🚪 退出登录
            </a>
        </div>
    </div>
</div>

<div class="container">
    <div class="stats-bar">
        <div class="stat-card">
            <h3>📊 今日事件总数</h3>
            <div class="number" id="todayTotal">0</div>
        </div>
        <div class="stat-card">
            <h3>⏳ 待标注事件</h3>
            <div class="number" id="unlabeledCount">0</div>
        </div>
        <div class="stat-card">
            <h3>✅ 已标注事件</h3>
            <div class="number" id="labeledCount">0</div>
        </div>
        <div class="stat-card">
            <h3>📅 本月事件总数</h3>
            <div class="number" id="monthTotal">0</div>
        </div>
    </div>

    <div class="toolbar">
        <div>
            <label for="beginDateFilter">📅 日期筛选：</label>
            <input type="date" id="beginDateFilter">
            <span style="margin: 0 5px;">至</span>
            <input type="date" id="endDateFilter">
        </div>
        <div>
            <label for="areaFilter">📍 区域筛选：</label>
            <select id="areaFilter" class="form-control noselect2">
                <option value="">全部区域</option>
            </select>
        </div>
        <div>
            <label for="statusFilter">🏷️ 状态筛选：</label>
            <select id="statusFilter" class="form-control noselect2">
                <option value="">全部状态</option>
            </select>
        </div>
        <div>
            <label for="reasonFilter">📝 原因筛选：</label>
            <select id="reasonFilter" class="form-control noselect2" multiple>
                <option value="盘库">盘库</option>
                <option value="入库物品">入库物品</option>
                <option value="出库物品">出库物品</option>
                <option value="巡查">巡查</option>
                <option value="整理">整理</option>
                <option value="其他">其他</option>
            </select>
        </div>
        <div>
            <label for="personFilter">👤 管理员筛选：</label>
            <select id="personFilter" class="form-control noselect2" multiple>
            </select>
        </div>
        <div>
            <label for="specialFilter">⚠️ 特殊筛选：</label>
            <select id="specialFilter" class="form-control noselect2" multiple>
                <option value="nonWorktime">非工作时间提示</option>
                <option value="abnormalPerson">人员异常数量</option>
            </select>
        </div>
        <button onclick="analyzeCompositeEvents(1)">🔍 筛选</button>
        <button onclick="resetFilters()" style="background: #868e96;">🔄 重置</button>
        <button onclick="syncCompositeEvents()" style="background: #ff6b6b;">⚡ 重新同步复合事件</button>
        <div style="flex-basis: 100%; height: 0;"></div>
        <button onclick="toggleSelectAll()" style="background: #20c997;">☑️ 全选/反选</button>
        <button onclick="exportSelectedCompositeEvents()" style="background: #ff9800;">📥 导出选中台账</button>
        <button onclick="exportSelectedEventPackages()" style="background: #ff8c42;">📦 导出事件包</button>
    </div>

    <div class="composite-section" id="compositeSection">
        <h2>
            <span>🔗 复合事件列表（事件经过还原）</span>
        </h2>
        <div id="compositeList"></div>

        <div id="pagination" class="pagination-container"></div>
    </div>
</div>

<div class="footer">
    Copyright © 2023-2024 某科技公司 版权所有
</div>


<script>
    // 数据变量
    let compositeEvents = []; // 复合事件数据
    let currentPage = 1; // 当前页码
    let pageSize = 10; // 每页显示数量
    let totalCount = 0; // 总记录数
    let isLoading = false; // 是否正在加载
    let currentFilters = {}; // 当前筛选条件

    // 区域邻接关系（定义哪些区域是相邻的）
    const areaAdjacency = {
        '库区大门': ['通道'],
        '通道': ['库区大门', '贵重物品区', '小库房门口'],
        '贵重物品区': ['通道'],
        '小库房门口': ['通道']
    };

    // 加载系统配置（标题等）
    function loadSystemConfig() {
        fetch('/system/config/info')
            .then(response => response.json())
            .then(data => {
                if (data.code === 0 && data.data) {
                    document.getElementById('systemTitle').textContent = data.data.title;
                    document.getElementById('systemSubtitle').textContent = data.data.subtitle;
                    document.title = data.data.title;
                }
            })
            .catch(error => {
                console.error('加载系统配置失败:', error);
            });
    }

    // 初始化页面
    function init() {
        loadSystemConfig();
        updateStats();
        // 加载筛选条件的下拉框数据
        loadAreaList();
        loadDictData();
        loadPersonList();

        // 设置默认日期：昨天到今天
        const today = new Date();
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);

        const yesterdayStr = yesterday.toISOString().split('T')[0];
        const todayStr = today.toISOString().split('T')[0];

        document.getElementById('beginDateFilter').value = yesterdayStr;
        document.getElementById('endDateFilter').value = todayStr;

        // 保存当前筛选条件
        currentFilters = {
            beginDateFilter: yesterdayStr,
            endDateFilter: todayStr,
            areaFilter: '',
            statusFilter: '',
            reasonFilter: '', // 新增
            personFilter: [],
            specialFilter: []
        };

        // 初始化 select2
        $('#reasonFilter').select2({
            width: '220px',
            placeholder: '请选择原因（可多选）',
            allowClear: true
        });

        $('#specialFilter').select2({
            width: '200px',
            placeholder: '请选择特殊筛选',
            allowClear: true
        });

        // 自动加载本月的复合事件（第一页）
        analyzeCompositeEvents(1);
    }

    // --- 字典和下拉框加载逻辑保持不变 (loadDictData, loadAreaList, loadPersonList) ---
    // 加载字典数据
    function loadDictData() {
        fetch('/caseapp/track/dict/biz_annotation_status')
            .then(response => response.json())
            .then(data => {
                if (data.code === 0 && data.data) {
                    const statusFilter = document.getElementById('statusFilter');
                    statusFilter.innerHTML = '<option value="">全部状态</option>';
                    const uniqueData = new Map();
                    data.data.forEach(item => {
                        if (!uniqueData.has(item.dictValue)) {
                            uniqueData.set(item.dictValue, item);
                        }
                    });
                    uniqueData.forEach(item => {
                        const option = document.createElement('option');
                        option.value = item.dictValue;
                        option.textContent = item.dictLabel;
                        statusFilter.appendChild(option);
                    });
                    $('#statusFilter').select2({ width: '180px', placeholder: '请选择状态' });
                }
            })
            .catch(error => console.error('获取字典数据失败:', error));
    }

    // 加载区域列表
    function loadAreaList() {
        fetch('/caseapp/roomip/areas', { method: 'POST' })
            .then(response => response.json())
            .then(data => {
                if (data.code === 0 && data.data) {
                    const areaFilter = document.getElementById('areaFilter');
                    areaFilter.innerHTML = '<option value="">全部区域</option>';
                    data.data.forEach(area => {
                        const option = document.createElement('option');
                        option.value = area;
                        option.textContent = area;
                        areaFilter.appendChild(option);
                    });
                    $('#areaFilter').select2({ width: '250px', placeholder: '请选择区域' });
                }
            });
    }

    // 加载人员列表（管理员）
    function loadPersonList() {
        fetch('/caseapp/person/persons', { method: 'POST' })
            .then(response => response.json())
            .then(data => {
                if (data.code === 0 && data.data) {
                    const personFilter = document.getElementById('personFilter');
                    if ($('#personFilter').data('select2')) { $('#personFilter').select2('destroy'); }
                    personFilter.innerHTML = '';
                    data.data.forEach(person => {
                        const option = document.createElement('option');
                        option.value = person;
                        option.textContent = person;
                        personFilter.appendChild(option);
                    });
                    $('#personFilter').select2({
                        width: '200px',
                        placeholder: '请选择管理员',
                        allowClear: true,
                        multiple: true
                    });
                }
            });
    }

    // 格式化日期时间
    function formatDateTime(dateStr) {
        if (!dateStr) return '';
        const date = new Date(dateStr);
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        const seconds = String(date.getSeconds()).padStart(2, '0');
        return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
    }

    // 更新统计数据
    function updateStats() {
        fetch('/caseapp/track/stats')
            .then(response => response.json())
            .then(data => {
                if (data.code === 0) {
                    document.getElementById('todayTotal').textContent = data.todayTotal || 0;
                    document.getElementById('unlabeledCount').textContent = data.unlabeledCount || 0;
                    document.getElementById('labeledCount').textContent = data.labeledCount || 0;
                    document.getElementById('monthTotal').textContent = data.monthTotal || 0;
                }
            })
            .catch(error => console.error('获取统计数据出错:', error));
    }

    // ===== 复合事件相关函数 (核心逻辑) =====

    // 重置所有筛选条件
    function resetFilters() {
        // 重置日期为昨天到今天
        const today = new Date();
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);

        const yesterdayStr = yesterday.toISOString().split('T')[0];
        const todayStr = today.toISOString().split('T')[0];

        document.getElementById('beginDateFilter').value = yesterdayStr;
        document.getElementById('endDateFilter').value = todayStr;

        // 重置其他筛选条件
        $('#areaFilter').val('').trigger('change');
        $('#statusFilter').val('').trigger('change');
        $('#reasonFilter').val(null).trigger('change'); // 重置原因（多选）
        $('#personFilter').val(null).trigger('change');
        $('#specialFilter').val(null).trigger('change');

        // 重新加载第一页
        analyzeCompositeEvents(1);
    }

    // 重新同步所有复合事件
    function syncCompositeEvents() {
        if (!confirm('确定要重新同步所有复合事件吗？\n\n这将根据当前筛选的时间范围，重新计算并覆盖数据库中的复合事件数据。')) {
            return;
        }

        let beginDateFilter = document.getElementById('beginDateFilter').value;
        let endDateFilter = document.getElementById('endDateFilter').value;

        if (!beginDateFilter || !endDateFilter) {
            alert('请先选择时间范围');
            return;
        }

        const beginDate = new Date(beginDateFilter);
        const endDate = new Date(endDateFilter);

        beginDate.setHours(0, 0, 0, 0);
        const beginPssj = beginDate.getFullYear() + '-' +
            String(beginDate.getMonth() + 1).padStart(2, '0') + '-' +
            String(beginDate.getDate()).padStart(2, '0') + ' 00:00:00';

        endDate.setHours(23, 59, 59, 999);
        const endPssj = endDate.getFullYear() + '-' +
            String(endDate.getMonth() + 1).padStart(2, '0') + '-' +
            String(endDate.getDate()).padStart(2, '0') + ' 23:59:59';

        const formData = new FormData();
        formData.append('params[beginPssj]', beginPssj);
        formData.append('params[endPssj]', endPssj);

        // 显示加载提示
        const loadingMsg = document.createElement('div');
        loadingMsg.innerHTML = '⏳ 正在同步复合事件，请稍候...';
        loadingMsg.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: white; padding: 20px 40px; border-radius: 8px; z-index: 9999; font-size: 16px;';
        document.body.appendChild(loadingMsg);

        fetch('/caseapp/track/syncCompositeEvents', {
            method: 'POST',
            body: formData
        })
            .then(response => response.json())
            .then(data => {
                if (loadingMsg.parentNode) document.body.removeChild(loadingMsg);
                if (data.code === 0) {
                    alert('✅ ' + data.msg);
                    analyzeCompositeEvents(1); // 重新加载
                } else {
                    alert('❌ 同步失败：' + data.msg);
                }
            })
            .catch(error => {
                if (loadingMsg.parentNode) document.body.removeChild(loadingMsg);
                alert('❌ 同步失败：' + error);
            });
    }

    // 加载复合事件列表（分页加载）
    // pageNum: 要加载的页码
    function analyzeCompositeEvents(pageNum = 1) {
        if (isLoading) return;

        isLoading = true;
        currentPage = pageNum; // 更新当前页码

        // 获取筛选条件
        let beginDateFilter = document.getElementById('beginDateFilter').value;
        let endDateFilter = document.getElementById('endDateFilter').value;
        let areaFilter = document.getElementById('areaFilter').value;
        let statusFilter = document.getElementById('statusFilter').value;
        let reasonFilter = $('#reasonFilter').val() || []; // 原因（多选）
        let personFilter = $('#personFilter').val() || [];
        let specialFilter = $('#specialFilter').val() || [];

        if (!beginDateFilter) beginDateFilter = new Date().toISOString().split('T')[0];
        if (!endDateFilter) endDateFilter = beginDateFilter;

        currentFilters = {
            beginDateFilter, endDateFilter, areaFilter, statusFilter, reasonFilter, personFilter, specialFilter
        };

        const beginDate = new Date(beginDateFilter);
        const endDate = new Date(endDateFilter);

        beginDate.setHours(0, 0, 0, 0);
        const beginPssj = beginDate.getFullYear() + '-' +
            String(beginDate.getMonth() + 1).padStart(2, '0') + '-' +
            String(beginDate.getDate()).padStart(2, '0') + ' ' +
            String(beginDate.getHours()).padStart(2, '0') + ':' +
            String(beginDate.getMinutes()).padStart(2, '0') + ':' +
            String(beginDate.getSeconds()).padStart(2, '0');

        endDate.setHours(23, 59, 59, 999);
        const endPssj = endDate.getFullYear() + '-' +
            String(endDate.getMonth() + 1).padStart(2, '0') + '-' +
            String(endDate.getDate()).padStart(2, '0') + ' ' +
            String(endDate.getHours()).padStart(2, '0') + ':' +
            String(endDate.getMinutes()).padStart(2, '0') + ':' +
            String(endDate.getSeconds()).padStart(2, '0');

        const formData = new FormData();
        formData.append('params[beginPssj]', beginPssj);
        formData.append('params[endPssj]', endPssj);
        formData.append('pageNum', currentPage);
        formData.append('pageSize', pageSize);

        if (areaFilter) formData.append('qymc', areaFilter);
        if (statusFilter) formData.append('bzzt', statusFilter);
        if (reasonFilter && reasonFilter.length > 0) formData.append('xwyy', reasonFilter.join(',')); // 添加原因筛选（多选，逗号分隔）
        if (personFilter && personFilter.length > 0) formData.append('ryxm', personFilter[0]);

        // 显示加载状态
        const list = document.getElementById('compositeList');
        list.innerHTML = '<div class="loading-tip"><div class="loading-spinner"></div><p>正在加载数据...</p></div>';

        fetch('/caseapp/track/compositeEvents', {
            method: 'POST',
            body: formData
        })
            .then(response => response.json())
            .then(data => {
                isLoading = false;

                if (data.code === 0) {
                    const rows = data.rows || [];
                    totalCount = data.total || 0;

                    // 计算起始编号： (当前页 - 1) * 每页大小
                    const startIndex = (currentPage - 1) * pageSize;

                    // 数据转换逻辑
                    compositeEvents = rows.map((comp, index) => {
                        const events = (comp.events || []).map(item => ({
                            id: item.id,
                            time: formatDateTime(item.pssj),
                            area: item.qymc || '',
                            videoUrl: item.spdz || '',
                            status: item.bzzt === '1' ? 'labeled' : 'unlabeled',
                            reason: item.xwyy || '',
                            persons: [],
                            spsc: item.spsc || '',
                            pstp: item.pstp || '',
                            rysl: item.rysl || 0,
                            pssj: item.pssj || '',
                            ryxmList: item.ryxm ? item.ryxm.split(',').filter(p => p && p.trim()) : [],
                            wlryList: item.wlry ? item.wlry.split(',').filter(p => p && p.trim()) : []
                        }));

                        events.forEach(event => { event.persons = [...event.ryxmList, ...event.wlryList]; });

                        const allPersons = new Set();
                        events.forEach(event => { event.ryxmList.forEach(p => allPersons.add(p)); });
                        const personsArray = Array.from(allPersons);

                        const allAreas = new Set();
                        events.forEach(event => { if (event.area) allAreas.add(event.area); });
                        const areasArray = Array.from(allAreas);

                        const specialTags = [];
                        // 特殊标签判断
                        if (comp.hasNonworktime === 1 || comp.hasNonworktime === '1') {
                            specialTags.push('非工作时间');
                        } else {
                            events.forEach(event => {
                                const eventTime = new Date(event.pssj);
                                const hour = eventTime.getHours();
                                if (hour < 9 || hour >= 17) {
                                    if (!specialTags.includes('非工作时间')) specialTags.push('非工作时间');
                                }
                            });
                        }

                        if (comp.hasAbnormalPerson === 1 || comp.hasAbnormalPerson === '1') {
                            specialTags.push('人员异常');
                        } else {
                            events.forEach(event => {
                                if (event.rysl > 0 && (event.rysl < 2 || event.rysl >= 3)) {
                                    if (!specialTags.includes('人员异常')) specialTags.push('人员异常');
                                }
                            });
                        }

                        return {
                            id: comp.id,
                            eventId: comp.eventId,
                            eventIndex: startIndex + index + 1, // 修正编号
                            events: events,
                            startTime: formatDateTime(comp.startTime),
                            endTime: formatDateTime(comp.endTime),
                            path: events.map(e => e.area),
                            eventCount: comp.eventCount,
                            bzzt: String(comp.bzzt || '0'),
                            persons: personsArray,
                            areas: areasArray,
                            specialTags: specialTags,
                            ryslMax: comp.ryslMax || 0,
                            hasNonworktime: comp.hasNonworktime || 0,
                            hasAbnormalPerson: comp.hasAbnormalPerson || 0,
                            xwyy: comp.xwyy || '',
                            ryxm: comp.ryxm || '',
                            wlry: comp.wlry || '',
                            remark: comp.remark || ''
                        };
                    });

                    // 前端特殊筛选（针对特殊标签）
                    if (specialFilter && specialFilter.length > 0) {
                        compositeEvents = compositeEvents.filter(comp => {
                            let matches = false;
                            if (specialFilter.includes('nonWorktime')) {
                                if (comp.specialTags.includes('非工作时间')) matches = true;
                            }
                            if (specialFilter.includes('abnormalPerson')) {
                                if (comp.specialTags.includes('人员异常')) matches = true;
                            }
                            return matches;
                        });
                    }

                    renderCompositeEvents();
                    renderPagination(totalCount, pageSize, currentPage);
                    updateStats();
                } else {
                    compositeEvents = [];
                    renderCompositeEvents();
                    renderPagination(0, pageSize, 1);
                    updateStats();
                }
            })
            .catch(error => {
                console.error('获取复合事件失败:', error);
                isLoading = false;
                compositeEvents = [];
                renderCompositeEvents();
            });
    }

    // 渲染分页控件
    function renderPagination(total, size, current) {
        const container = document.getElementById('pagination');
        if (total === 0) {
            container.innerHTML = '';
            return;
        }

        const totalPages = Math.ceil(total / size);
        if (totalPages <= 1) {
            container.innerHTML = '';
            return;
        }

        let html = '<ul class="pagination">';

        // 上一页
        const prevDisabled = current === 1 ? 'disabled' : '';
        html += `<li class="page-item ${prevDisabled}" onclick="${current > 1 ? `changePage(${current - 1})` : ''}">
                        <a class="page-link">上一页</a>
                     </li>`;

        // 页码生成逻辑 (最多显示5个页码 + 省略号)
        let startPage = Math.max(1, current - 2);
        let endPage = Math.min(totalPages, current + 2);

        if (startPage > 1) {
            html += `<li class="page-item" onclick="changePage(1)"><a class="page-link">1</a></li>`;
            if (startPage > 2) {
                html += `<li class="page-item disabled"><a class="page-link">...</a></li>`;
            }
        }

        for (let i = startPage; i <= endPage; i++) {
            const active = i === current ? 'active' : '';
            html += `<li class="page-item ${active}" onclick="changePage(${i})">
                            <a class="page-link">${i}</a>
                         </li>`;
        }

        if (endPage < totalPages) {
            if (endPage < totalPages - 1) {
                html += `<li class="page-item disabled"><a class="page-link">...</a></li>`;
            }
            html += `<li class="page-item" onclick="changePage(${totalPages})"><a class="page-link">${totalPages}</a></li>`;
        }

        // 下一页
        const nextDisabled = current === totalPages ? 'disabled' : '';
        html += `<li class="page-item ${nextDisabled}" onclick="${current < totalPages ? `changePage(${current + 1})` : ''}">
                        <a class="page-link">下一页</a>
                     </li>`;

        html += `</ul>`;

        // 添加总数显示
        html += `<span style="margin-left: 15px; color: #666; font-size: 14px;">共 ${total} 条 / ${totalPages} 页</span>`;

        container.innerHTML = html;
    }

    // 切换页码
    function changePage(page) {
        if (page === currentPage || isLoading) return;

        // 先滚动到顶部
        window.scrollTo({ top: 0, behavior: 'smooth' });

        // 再加载数据
        analyzeCompositeEvents(page);
    }

    // 计算时长
    function calculateDuration(startTime, endTime) {
        const start = new Date(startTime);
        const end = new Date(endTime);
        const diffSeconds = Math.floor((end - start) / 1000);

        if (diffSeconds < 60) return `${diffSeconds}秒`;
        else if (diffSeconds < 3600) {
            const mins = Math.floor(diffSeconds / 60);
            const secs = diffSeconds % 60;
            return `${mins}分${secs}秒`;
        } else {
            const hours = Math.floor(diffSeconds / 3600);
            const mins = Math.floor((diffSeconds % 3600) / 60);
            const secs = diffSeconds % 60;
            return `${hours}小时${mins}分${secs}秒`;
        }
    }

    }

    function saveCompositeAnnotation() {
        const xwyy = document.getElementById('annot_xwyy').value;
        const ryxmArray = $('#annot_ryxm').val();
        const ryxm = ryxmArray ? ryxmArray.join(',') : '';
        const wlry = document.getElementById('annot_wlry').value;
        const remark = document.getElementById('annot_remark').value;

        if (!xwyy) { alert('请选择行为原因'); return; }

        const formData = new FormData();
        formData.append('eventId', currentAnnotationEventId);
        formData.append('xwyy', xwyy);
        formData.append('ryxm', ryxm);
        formData.append('wlry', wlry);
        formData.append('remark', remark);

        fetch('/caseapp/track/annotateCompositeEvent', { method: 'POST', body: formData })
            .then(response => response.json())
            .then(data => {
                if (data.code === 0) {
                    alert('✅ 标注成功！');
                    closeAnnotationModal();
                    analyzeCompositeEvents(currentPage); // 刷新当前页
                } else { alert('❌ 标注失败：' + data.msg); }
            })
            .catch(error => alert('❌ 标注失败：' + error));
    }
</script>

<div id="compositeAnnotationModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center;">
    <div style="background: white; border-radius: 8px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.3);">
        <div style="background: linear-gradient(135deg, #4c6ef5 0%, #364fc7 100%); color: white; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center;">
            <h2 style="margin: 0; font-size: 20px;">✏️ 标注复合事件</h2>
            <button onclick="closeAnnotationModal()" style="background: rgba(255,255,255,0.2); border: none; color: white; font-size: 24px; width: 36px; height: 36px; border-radius: 50%; cursor: pointer;">×</button>
        </div>
        <div style="padding: 30px;">
            <form id="annotationForm">
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: bold; color: #333;"><span style="color: #ff6b6b;">*</span> 行为原因：</label>
                    <select id="annot_xwyy" style="width: 100%; padding: 10px; border: 2px solid #dee2e6; border-radius: 4px; font-size: 14px;">
                        <option value="">请选择行为原因</option>
                        <option value="盘库">盘库</option>
                        <option value="入库物品">入库物品</option>
                        <option value="出库物品">出库物品</option>
                        <option value="巡查">巡查</option>
                        <option value="整理">整理</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <div id="annot_ryxm_container" style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: bold; color: #333;">👤 管理员姓名：</label>
                    <select id="annot_ryxm" class="form-control" multiple style="width: 100%; display: block !important; visibility: visible !important;">
                        <option value="">加载中...</option>
                    </select>
                    <small style="color: #868e96; font-size: 12px;">可多选，选中后会显示为标签</small>
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: bold; color: #333;">🔶 外来人员：</label>
                    <input type="text" id="annot_wlry" placeholder="多个人员用逗号分隔" style="width: 100%; padding: 10px; border: 2px solid #dee2e6; border-radius: 4px; font-size: 14px;">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: bold; color: #333;">📝 备注：</label>
                    <textarea id="annot_remark" placeholder="请输入备注信息" style="width: 100%; padding: 10px; border: 2px solid #dee2e6; border-radius: 4px; font-size: 14px; min-height: 80px; resize: vertical;"></textarea>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 30px;">
                    <button type="button" onclick="closeAnnotationModal()" style="flex: 1; padding: 12px; background: #868e96; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">取消</button>
                    <button type="button" onclick="saveCompositeAnnotation()" style="flex: 2; padding: 12px; background: #4c6ef5; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold;">✅ 保存标注</button>
                </div>
            </form>
        </div>
    </div>
</div>

<th:block th:include="include :: footer" />
<th:block th:include="include :: select2-js" />
<th:block th:include="include :: bootstrap-select-js" />
</body>
</html>

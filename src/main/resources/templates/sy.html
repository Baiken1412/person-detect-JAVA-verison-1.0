<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资产视频分析插件</title>
    <th:block th:include="include :: select2-css" />
    <th:block th:include="include :: bootstrap-select-css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        .header {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            color: white;
            padding: 40px 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            border-radius: 50%;
        }

        .header-content {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-logo {
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        .header-logo img {
            height: 80px;
            width: auto;
            mix-blend-mode: multiply;
            /* 如果multiply效果不好，可以尝试 screen 或 darken */
        }

        .header-text h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header-text p {
            font-size: 16px;
            opacity: 0.95;
            letter-spacing: 1px;
        }

        .footer {
            background: #2c3e50;
            color: #ecf0f1;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            font-size: 14px;
        }

        .footer a {
            color: #3498db;
            text-decoration: none;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 4px solid #2a5298;
        }

        .stat-card h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .stat-card .number {
            font-size: 28px;
            font-weight: bold;
            color: #2a5298;
        }

        .toolbar {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }

        .toolbar > div {
            display: flex;
            align-items: center;
        }

        /* 区域筛选容器更宽 */
        .toolbar > div:nth-child(2) {
            min-width: 250px;
        }

        /* 状态筛选容器更宽 */
        .toolbar > div:nth-child(3) {
            min-width: 200px;
        }

        /* 管理员筛选容器更宽 */
        .toolbar > div:nth-child(4) {
            min-width: 200px;
        }

        /* 特殊筛选容器更宽 */
        .toolbar > div:nth-child(5) {
            min-width: 200px;
        }

        .toolbar label {
            font-size: 14px;
            color: #666;
            margin-right: 8px;
            white-space: nowrap;
        }

        .toolbar input[type="date"],
        .toolbar select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        /* select2 容器对齐 */
        .toolbar .select2-container {
            vertical-align: middle;
        }

        .toolbar .select2-selection {
            height: auto;
            min-height: 38px;
            display: flex;
            align-items: center;
        }

        .toolbar .select2-selection__rendered {
            line-height: 38px;
        }

        /* 标注模态框中的 Select2 样式 */
        #compositeAnnotationModal .select2-container--default .select2-selection--multiple {
            border: 2px solid #dee2e6 !important;
            border-radius: 4px !important;
            min-height: 42px !important;
            padding: 5px 10px !important;
            background: white !important;
            position: relative !important;
        }

        /* 添加下拉箭头指示 */
        #compositeAnnotationModal .select2-container--default .select2-selection--multiple::after {
            content: '▼';
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #868e96;
            font-size: 12px;
        }

        #compositeAnnotationModal .select2-container--default .select2-selection--multiple:hover {
            border-color: #4c6ef5 !important;
        }

        /* Placeholder 文字颜色设置为深黑色 */
        #compositeAnnotationModal .select2-search__field::placeholder {
            color: #333 !important;
            opacity: 1 !important;
        }

        #compositeAnnotationModal .select2-search__field::-webkit-input-placeholder {
            color: #333 !important;
            opacity: 1 !important;
        }

        #compositeAnnotationModal .select2-search__field::-moz-placeholder {
            color: #333 !important;
            opacity: 1 !important;
        }

        .toolbar button {
            padding: 8px 20px;
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .toolbar button:hover {
            background: #1e3c72;
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .event-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .event-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }

        .event-card.unlabeled {
            border: 2px solid #ff6b6b;
        }

        .event-card.labeled {
            border: 2px solid #51cf66;
        }

        .event-card.worktime-warning {
            border: 3px solid #ff6b6b;
            background: linear-gradient(135deg, #fff5f5 0%, #ffffff 100%);
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
        }

        .event-card.worktime-warning:hover {
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }

        .worktime-warning-badge {
            display: inline-block;
            background: #ff6b6b;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 8px;
        }

        .event-thumbnail {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
            position: relative;
            overflow: hidden;
        }

        .event-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .event-thumbnail .thumbnail-icon {
            font-size: 48px;
            z-index: 1;
            /* 指定Emoji字体，提高兼容性 */
            font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "EmojiOne Color", "Android Emoji", sans-serif;
        }

        .event-status {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .event-status.unlabeled {
            background: #ff6b6b;
            color: white;
        }

        .event-status.labeled {
            background: #51cf66;
            color: white;
        }

        .event-info {
            padding: 15px;
        }

        .event-time {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .event-location {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }

        .event-location::before {
            content: "📍";
            margin-right: 5px;
        }

        .event-reason {
            font-size: 13px;
            color: #888;
            padding: 5px 10px;
            background: #f8f9fa;
            border-radius: 4px;
            display: inline-block;
        }

        .event-suggestion {
            font-size: 12px;
            color: #ff9800;
            padding: 8px 10px;
            background: #fff3e0;
            border-radius: 4px;
            margin-top: 8px;
            border-left: 3px solid #ff9800;
        }

        .event-suggestion::before {
            content: "💡 ";
        }


        .no-events {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .no-events svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .loading-tip {
            text-align: center;
            padding: 20px;
            color: #999;
            grid-column: 1 / -1;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #2a5298;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }


        /* ===== Composite Events ===== */
        .composite-section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .composite-section h2 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #2a5298;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .composite-card {
            background: white;
            border: 2px solid #9775fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .composite-card:hover {
            background: #f3f0ff;
            box-shadow: 0 4px 12px rgba(151,117,250,0.2);
        }

        .composite-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .composite-title {
            font-weight: bold;
            color: #9775fa;
            font-size: 16px;
        }

        .composite-badge {
            background: #9775fa;
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
        }

        .composite-path {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .composite-time-range {
            color: #999;
            font-size: 13px;
        }

        .analyze-btn {
            padding: 8px 16px;
            background: #51cf66;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .analyze-btn:hover {
            background: #40c057;
        }

        @media (max-width: 768px) {
            .header {
                padding: 30px 20px;
            }

            .header-content {
                flex-direction: column;
                text-align: center;
            }

            .header-logo img {
                height: 60px;
            }

            .header-text h1 {
                font-size: 24px;
            }

            .header-text p {
                font-size: 14px;
            }

            .events-grid {
                grid-template-columns: 1fr;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .toolbar > * {
                width: 100%;
            }

            .modal-content {
                width: 95%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="header-logo"><img src="/图片1.png" alt="系统Logo"></div>
            <div class="header-text">
                <h1 id="systemTitle">资产视频分析插件</h1>
                <p id="systemSubtitle">人员活动自动识别与追溯管理系统</p>
            </div>
            <div style="margin-left: auto; display: flex; gap: 10px;">
                <button style="background: rgba(255,255,255,0.4); border: 1px solid white; color: white; padding: 10px 20px; border-radius: 4px; cursor: default; font-size: 14px; font-weight: bold;">
                    🏠 事件页面
                </button>
                <button onclick="goToEventList()" style="background: rgba(255,255,255,0.2); border: 1px solid white; color: white; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; transition: background 0.3s;">
                    📝 轨迹页面
                </button>
                <button onclick="goToDailyReport()" style="background: rgba(255,255,255,0.2); border: 1px solid white; color: white; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; transition: background 0.3s;">
                    📊 每日报告
                </button>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- 统计卡片 -->
        <div class="stats-bar">
            <div class="stat-card">
                <h3>📊 今日事件总数</h3>
                <div class="number" id="todayTotal">0</div>
            </div>
            <div class="stat-card">
                <h3>⏳ 待标注事件</h3>
                <div class="number" id="unlabeledCount">0</div>
            </div>
            <div class="stat-card">
                <h3>✅ 已标注事件</h3>
                <div class="number" id="labeledCount">0</div>
            </div>
            <div class="stat-card">
                <h3>📅 本月事件总数</h3>
                <div class="number" id="monthTotal">0</div>
            </div>
        </div>

        <!-- 工具栏 -->
        <div class="toolbar">
            <div>
                <label for="beginDateFilter">📅 日期筛选：</label>
                <input type="date" id="beginDateFilter">
                <span style="margin: 0 5px;">至</span>
                <input type="date" id="endDateFilter">
            </div>
            <div>
                <label for="areaFilter">📍 区域筛选：</label>
                <select id="areaFilter" class="form-control noselect2">
                    <option value="">全部区域</option>
                </select>
            </div>
            <div>
                <label for="statusFilter">🏷️ 状态筛选：</label>
                <select id="statusFilter" class="form-control noselect2">
                    <option value="">全部状态</option>
                </select>
            </div>
            <div>
                <label for="personFilter">👤 管理员筛选：</label>
                <select id="personFilter" class="form-control noselect2" multiple>
                    <!-- 人员选项将通过JavaScript动态生成 -->
                </select>
            </div>
            <div>
                <label for="specialFilter">⚠️ 特殊筛选：</label>
                <select id="specialFilter" class="form-control noselect2" multiple>
                    <option value="nonWorktime">非工作时间提示</option>
                    <option value="abnormalPerson">人员异常数量</option>
                </select>
            </div>
            <button onclick="analyzeCompositeEvents()">🔍 筛选</button>
            <button onclick="resetFilters()" style="background: #868e96;">🔄 重置</button>
            <button onclick="syncCompositeEvents()" style="background: #ff6b6b;">⚡ 重新同步复合事件</button>
            <div style="flex-basis: 100%; height: 0;"></div>
            <button onclick="toggleSelectAll()" style="background: #20c997;">☑️ 全选/反选</button>
            <button onclick="exportSelectedCompositeEvents()" style="background: #ff9800;">📥 导出选中台账</button>
            <button onclick="exportSelectedEventPackages()" style="background: #ff8c42;">📦 导出事件包</button>
        </div>

        <!-- 复合事件区域 -->
        <div class="composite-section" id="compositeSection">
            <h2>
                <span>🔗 复合事件列表（事件经过还原）</span>
            </h2>
            <div id="compositeList"></div>
        </div>
    </div>

    <div class="footer">
        Copyright © 2023-2024 某科技公司 版权所有
    </div>


    <script>
        // 事件数据
        let eventsData = []; // 事件数据
        let compositeEvents = []; // 复合事件数据
        let currentPage = 1; // 当前页码
        let pageSize = 10; // 每页显示数量
        let totalCount = 0; // 总记录数
        let hasMore = true; // 是否还有更多数据
        let isLoading = false; // 是否正在加载中
        let currentFilters = {}; // 当前筛选条件

        // 区域邻接关系（定义哪些区域是相邻的）
        const areaAdjacency = {
            '库区大门': ['通道'],
            '通道': ['库区大门', '贵重物品区', '小库房门口'],
            '贵重物品区': ['通道'],
            '小库房门口': ['通道']
        };

        // 加载系统配置（标题等）
        function loadSystemConfig() {
            fetch('/system/config/info')
                .then(response => response.json())
                .then(data => {
                    if (data.code === 0 && data.data) {
                        document.getElementById('systemTitle').textContent = data.data.title;
                        document.getElementById('systemSubtitle').textContent = data.data.subtitle;
                        document.title = data.data.title;
                    }
                })
                .catch(error => {
                    console.error('加载系统配置失败:', error);
                });
        }

        // 初始化页面
        function init() {
            loadSystemConfig();
            updateStats();
            // 加载筛选条件的下拉框数据
            loadAreaList();
            loadDictData();
            loadPersonList();

            // 设置默认日期：本月第一天到今天
            const today = new Date();
            const firstDayOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);

            const firstDayStr = firstDayOfMonth.toISOString().split('T')[0];
            const todayStr = today.toISOString().split('T')[0];

            document.getElementById('beginDateFilter').value = firstDayStr;
            document.getElementById('endDateFilter').value = todayStr;

            // 保存当前筛选条件
            currentFilters = {
                beginDateFilter: firstDayStr,
                endDateFilter: todayStr,
                areaFilter: '',
                statusFilter: '',
                personFilter: [],
                specialFilter: []
            };

            // 初始化特殊筛选的select2
            $('#specialFilter').select2({
                width: '200px',
                placeholder: '请选择特殊筛选',
                allowClear: true
            });

            // 自动加载本月的复合事件
            analyzeCompositeEvents();

            // 设置滚动监听
            setupScrollListener();
        }
        
        // 设置滚动监听
        function setupScrollListener() {
            let scrollTimer = null;
            window.addEventListener('scroll', function() {
                // 防抖处理
                if (scrollTimer) {
                    clearTimeout(scrollTimer);
                }
                scrollTimer = setTimeout(function() {
                    // 检查是否滚动到底部
                    const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                    const windowHeight = window.innerHeight;
                    const documentHeight = document.documentElement.scrollHeight;
                    
                    // 当距离底部小于100px时，加载更多
                    if (documentHeight - scrollTop - windowHeight < 100) {
                        loadMoreEvents();
                    }
                }, 100);
            });
        }

        // 加载字典数据
        function loadDictData() {
            fetch('/caseapp/track/dict/biz_annotation_status')
                .then(response => {
                    console.log('字典数据响应状态:', response.status);
                    return response.json();
                })
                .then(data => {
                    console.log('字典数据返回:', data);
                    if (data.code === 0 && data.data) {
                        const statusFilter = document.getElementById('statusFilter');
                        // 保留"全部状态"选项
                        statusFilter.innerHTML = '<option value="">全部状态</option>';

                        if (data.data.length === 0) {
                            console.warn('警告: 字典数据为空，请检查数据库中是否存在 biz_annotation_status 类型的字典数据');
                            // 添加默认选项
                            const defaultOptions = [
                                {dictValue: '0', dictLabel: '未标注'},
                                {dictValue: '1', dictLabel: '已标注'}
                            ];
                            defaultOptions.forEach(item => {
                                const option = document.createElement('option');
                                option.value = item.dictValue;
                                option.textContent = item.dictLabel;
                                statusFilter.appendChild(option);
                            });
                        } else {
                            // 去重：使用Map确保每个dictValue只出现一次
                            const uniqueData = new Map();
                            data.data.forEach(item => {
                                if (!uniqueData.has(item.dictValue)) {
                                    uniqueData.set(item.dictValue, item);
                                }
                            });

                            // 添加字典选项
                            uniqueData.forEach(item => {
                                const option = document.createElement('option');
                                option.value = item.dictValue;
                                option.textContent = item.dictLabel;
                                statusFilter.appendChild(option);
                            });
                        }

                        // 初始化 select2
                        $('#statusFilter').select2({
                            width: '200px',
                            placeholder: '请选择状态'
                        });
                    } else {
                        console.error('字典数据格式错误:', data);
                        // 使用默认选项
                        const statusFilter = document.getElementById('statusFilter');
                        statusFilter.innerHTML = '<option value="">全部状态</option>';
                        const defaultOptions = [
                            {dictValue: '0', dictLabel: '未标注'},
                            {dictValue: '1', dictLabel: '已标注'}
                        ];
                        defaultOptions.forEach(item => {
                            const option = document.createElement('option');
                            option.value = item.dictValue;
                            option.textContent = item.dictLabel;
                            statusFilter.appendChild(option);
                        });
                        $('#statusFilter').select2({
                            width: '200px',
                            placeholder: '请选择状态'
                        });
                    }
                })
                .catch(error => {
                    console.error('获取字典数据失败:', error);
                    // 即使失败也提供默认选项
                    const statusFilter = document.getElementById('statusFilter');
                    statusFilter.innerHTML = '<option value="">全部状态</option>';
                    const defaultOptions = [
                        {dictValue: '0', dictLabel: '未标注'},
                        {dictValue: '1', dictLabel: '已标注'}
                    ];
                    defaultOptions.forEach(item => {
                        const option = document.createElement('option');
                        option.value = item.dictValue;
                        option.textContent = item.dictLabel;
                        statusFilter.appendChild(option);
                    });
                    $('#statusFilter').select2({

        // 加载事件列表（支持分页）
        function loadEvents(beginDateFilter, endDateFilter, areaFilter, statusFilter, personFilter, pageNum, append) {
            if (isLoading) return; // 如果正在加载，直接返回
            
            isLoading = true;
            const formData = new FormData();
            
            // 设置分页参数
            formData.append('pageNum', pageNum || 1);
            formData.append('pageSize', pageSize);
            
            // 设置状态筛选（对应实体类 bzzt 字段）
            if (statusFilter) {
                formData.append('bzzt', statusFilter);
            }
            
            // 设置区域筛选（对应实体类 qymc 字段）
            if (areaFilter) {
                formData.append('qymc', areaFilter);
            }
            
            // 设置管理员筛选（对应实体类 ryxm 字段，支持多选，使用模糊查询）
            // 如果选择了多个管理员，使用逗号拼接
            if (personFilter && personFilter.length > 0) {
                // 将多个管理员用逗号拼接成一个字符串
                const personStr = personFilter.join(',');
                formData.append('ryxm', personStr);
            }
            
            // 设置时间区间（对应 params.beginPssj 和 params.endPssj）
            // 如果开始日期为空，默认使用今天
            let beginDateStr = beginDateFilter || new Date().toISOString().split('T')[0];
            // 如果结束日期为空，默认使用开始日期（同一天）
            let endDateStr = endDateFilter || beginDateStr;
            
            const beginDate = new Date(beginDateStr);
            const endDate = new Date(endDateStr);
            
            // 开始时间：开始日期当天 0:00:00
            beginDate.setHours(0, 0, 0, 0);
            const beginPssj = beginDate.getFullYear() + '-' + 
                String(beginDate.getMonth() + 1).padStart(2, '0') + '-' + 
                String(beginDate.getDate()).padStart(2, '0') + ' ' +
                String(beginDate.getHours()).padStart(2, '0') + ':' +
                String(beginDate.getMinutes()).padStart(2, '0') + ':' +
                String(beginDate.getSeconds()).padStart(2, '0');
            
            // 结束时间：结束日期当天 23:59:59
            endDate.setHours(23, 59, 59, 999);
            const endPssj = endDate.getFullYear() + '-' + 
                String(endDate.getMonth() + 1).padStart(2, '0') + '-' + 
                String(endDate.getDate()).padStart(2, '0') + ' ' +
                String(endDate.getHours()).padStart(2, '0') + ':' +
                String(endDate.getMinutes()).padStart(2, '0') + ':' +
                String(endDate.getSeconds()).padStart(2, '0');
            
            formData.append('params[beginPssj]', beginPssj);
            formData.append('params[endPssj]', endPssj);
            
            fetch('/caseapp/track/events', {
                method: 'POST',
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    isLoading = false;
                    if (data.code === 0 && data.rows) {
                        totalCount = data.total || 0;
                        const newEvents = data.rows.map(item => {
                            const event = {
                                id: item.id,
                                time: formatDateTime(item.pssj),
                                area: item.qymc || '',
                                videoUrl: item.spdz || '',
                                status: item.bzzt === '1' ? 'labeled' : 'unlabeled',
                                reason: item.xwyy || '',
                                reasonDetail: '',
                                persons: [],
                                operator: '',
                                operateTime: item.bzsj || '',
                                spsc: item.spsc || '',
                                pstp: item.pstp || '', // 图片路径
                                rysl: item.rysl || 0, // 人员数量
                                pssj: item.pssj || '', // 原始拍摄时间字符串
                                suggestions: []
                            };
                            
                            // 解析人员信息
                            if (item.ryxm) {
                                event.persons.push(item.ryxm);
                            }
                            if (item.wlry) {
                                event.persons.push(item.wlry);
                            }
                            
                            // 解析原因详情
                            if (item.xwyy && item.xwyy.includes('：')) {
                                const parts = item.xwyy.split('：', 2);
                                event.reason = parts[0];
                                event.reasonDetail = parts[1];
                            } else {
                                event.reason = item.xwyy || '';
                            }
                            
                            if (item.bzzt === '1') {
                                event.operator = item.ryxm || '';
                            }
                            
                            return event;
                        });
                        
                        if (append) {
                            // 追加模式：将新数据追加到现有数据
                            eventsData = eventsData.concat(newEvents);
                            currentPage = pageNum; // 更新当前页码
                        } else {
                            // 替换模式：重置数据
                            eventsData = newEvents;
                            currentPage = pageNum || 1;
                        }
                        
                        // 检查是否还有更多数据
                        if (totalCount === 0) {
                            // 如果没有数据，肯定没有更多
                            hasMore = false;
                        } else if (newEvents.length < pageSize) {
                            // 如果当前页返回的数据少于 pageSize，说明已经是最后一页
                            hasMore = false;
                        } else {
                            // 否则根据已加载数量和总数判断
                            hasMore = eventsData.length < totalCount;
                        }
                        
                        // 应用特殊筛选（如果有）
                        let filteredEvents = eventsData;
                        if (currentFilters.specialFilter && currentFilters.specialFilter.length > 0) {
                            filteredEvents = filterEventsBySpecial(eventsData, currentFilters.specialFilter);
                        }
                        
                        renderEvents(filteredEvents);
                        // 分析复合事件
                        analyzeCompositeEvents();
                    } else {
                        if (!append) {
                            eventsData = [];
                            renderEvents([]);
                        }
                        hasMore = false;
                        compositeEvents = [];
                        renderCompositeEvents();
                    }
                })
                .catch(error => {
                    isLoading = false;
                    console.error('获取事件列表失败:', error);
                    if (!append) {
                        eventsData = [];
                        renderEvents([]);
                    }
                    hasMore = false;
                });
        }
        
        // 加载更多事件（滚动加载）
        function loadMoreEvents() {
            if (!hasMore || isLoading) {
                return;
            }

            // 页码+1，加载下一页
            currentPage++;
            analyzeCompositeEvents(true); // 追加模式
        }

        // 格式化日期时间
        function formatDateTime(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        }

        // 检查是否满足工作时间超过3人进入的条件
        // 条件：pssj在9时-18时 且 rysl >= 3
        function isWorktimeWarning(event) {
            if (!event.pssj) return false;
            
            // 检查时间是否在9时-18时之间
            const date = new Date(event.pssj);
            const hour = date.getHours();
            if (hour < 9 || hour >= 18) {
                return false;
            }
            
            // 检查人员数量是否 >= 3
            if (!event.rysl || event.rysl < 3) {
                return false;
            }
            
            return true;
        }

        // 检查是否满足非工作时间提示条件
        // 条件：拍摄时间不在 9:00-18:00 之间 且 rysl >= 1
        function isNonWorktimeWarning(event) {
            if (!event.pssj) return false;
            
            // 检查时间是否不在9时-18时之间
            const date = new Date(event.pssj);
            const hour = date.getHours();
            if (hour >= 9 && hour < 18) {
                return false;
            }
            
            // 检查人员数量是否 >= 1
            if (!event.rysl || event.rysl < 1) {
                return false;
            }
            
            return true;
        }

        // 检查是否满足人员异常数量条件
        // 条件：pssj在9时-18时 且 rysl >= 3
        function isAbnormalPersonCount(event) {
            return isWorktimeWarning(event);
        }

        // 根据特殊筛选条件过滤事件
        function filterEventsBySpecial(events, specialFilters) {
            if (!specialFilters || specialFilters.length === 0) {
                return events;
            }
            
            return events.filter(event => {
                let matches = false;
                
                // 如果选择了"非工作时间提示"
                if (specialFilters.includes('nonWorktime')) {
                    if (isNonWorktimeWarning(event)) {
                        matches = true;
                    }
                }
                
                // 如果选择了"人员异常数量"
                if (specialFilters.includes('abnormalPerson')) {
                    if (isAbnormalPersonCount(event)) {
                        matches = true;
                    }
                }
                
                // 如果两个条件都选择了，只要满足其中一个就返回true（OR逻辑）
                // 如果只选择了一个条件，必须满足该条件
                return matches;
            });
        }

        // 解析时长（秒）
        function parseDuration(durationStr) {
            if (!durationStr) return 0;
            // 假设格式为 "XX秒" 或 "XX"
            const match = durationStr.match(/(\d+)/);
            return match ? parseInt(match[1]) : 0;
        }

        // 渲染事件列表
        function renderEvents(events) {
            const grid = document.getElementById('eventsGrid');

            if (events.length === 0) {
                grid.innerHTML = `
                    <div class="no-events">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <p>暂无事件记录</p>
                    </div>
                `;
                return;
            }

            // 移除加载提示
            const loadingTip = grid.querySelector('.loading-tip');
            if (loadingTip) {
                loadingTip.remove();
            }

            grid.innerHTML = events.map(event => {
                // 检查是否满足工作时间警告条件（人员异常数量）
                const isWarning = isWorktimeWarning(event);
                // 检查是否满足非工作时间警告条件
                const isNonWorktime = isNonWorktimeWarning(event);
                const warningClass = isWarning ? 'worktime-warning' : '';
                
                return `
                <div class="event-card ${event.status} ${warningClass}" onclick="openEventDetail('${event.id}')">
                    <div class="event-thumbnail">
                        ${event.pstp ? `<img src="${event.pstp}" alt="事件缩略图" onerror="this.onerror=null; this.src=''; this.style.display='none'; this.nextElementSibling.style.display='inline-block';" /><span class="thumbnail-icon" style="display:none;">🎥</span>` : '<span class="thumbnail-icon">🎥</span>'}
                        <span class="event-status ${event.status}">
                            ${event.status === 'unlabeled' ? '待标注' : '已标注'}
                        </span>
                    </div>
                    <div class="event-info">
                        <div class="event-time">${event.time}</div>
                        <div class="event-location">${event.area}</div>
                        ${isWarning ? `
                            <div class="worktime-warning-badge">⚠️ 工作时间超过3人进入</div>
                        ` : ''}
                        ${isNonWorktime ? `
                            <div class="worktime-warning-badge" style="background: #ff9800;">⚠️ 非工作时间进入</div>
                        ` : ''}
                        ${event.status === 'labeled' ? `
                            ${event.persons && event.persons.length > 0 ? `
                                <div class="event-reason">
                                    👤 ${event.persons.join('、')}
                                </div>
                            ` : ''}
                            <div class="event-reason">
                                ${event.reason === '其他' ? event.reason + '：' + event.reasonDetail : event.reason}
                            </div>
                        ` : `
                            <div class="event-reason">待标注原因</div>
                            ${event.suggestions && event.suggestions.length > 0 ? `
                                <div class="event-suggestion">
                                    该时段前后可能有${event.suggestions.join('、')}操作
                                </div>
                            ` : ''}
                        `}
                    </div>
                </div>
            `;
            }).join('');
            
            // 如果还有更多数据，显示加载提示
            if (hasMore) {
                const loadingTip = document.createElement('div');
                loadingTip.className = 'loading-tip';
                loadingTip.innerHTML = '<div class="loading-spinner"></div><p>滚动加载更多...</p>';
                grid.appendChild(loadingTip);
            } else if (events.length > 0) {
                const loadingTip = document.createElement('div');
                loadingTip.className = 'loading-tip';
                // 如果应用了特殊筛选，显示筛选后的实际数量；否则显示总数
                const displayCount = (currentFilters.specialFilter && currentFilters.specialFilter.length > 0) 
                    ? events.length 
                    : totalCount;
                loadingTip.innerHTML = '<p>已加载全部数据（共 ' + displayCount + ' 条）</p>';
                grid.appendChild(loadingTip);
            }
        }

        // 导出台账数据
        function exportData() {
            const beginDateFilter = currentFilters.beginDateFilter || document.getElementById('beginDateFilter').value;
            const endDateFilter = currentFilters.endDateFilter || document.getElementById('endDateFilter').value;
            const areaFilter = currentFilters.areaFilter || $('#areaFilter').val();
            const statusFilter = currentFilters.statusFilter || $('#statusFilter').val();
            const personFilter = currentFilters.personFilter || $('#personFilter').val() || [];

            // 构建POST参数数组
            var dataParam = [];

            // 设置状态筛选（对应实体类 bzzt 字段）
            if (statusFilter) {
                dataParam.push({ "name": "bzzt", "value": statusFilter });
            }

            // 设置区域筛选（对应实体类 qymc 字段）
            if (areaFilter) {
                dataParam.push({ "name": "qymc", "value": areaFilter });
            }

            // 设置管理员筛选（对应实体类 ryxm 字段）
            if (personFilter && personFilter.length > 0) {
                dataParam.push({ "name": "ryxm", "value": personFilter.join(',') });
            }

            // 设置时间区间
            let beginDateStr = beginDateFilter || new Date().toISOString().split('T')[0];
            let endDateStr = endDateFilter || beginDateStr;

            const beginDate = new Date(beginDateStr);
            const endDate = new Date(endDateStr);

            // 开始时间：开始日期当天 0:00:00
            beginDate.setHours(0, 0, 0, 0);
            const beginPssj = beginDate.getFullYear() + '-' +
                String(beginDate.getMonth() + 1).padStart(2, '0') + '-' +
                String(beginDate.getDate()).padStart(2, '0') + ' ' +
                String(beginDate.getHours()).padStart(2, '0') + ':' +
                String(beginDate.getMinutes()).padStart(2, '0') + ':' +
                String(beginDate.getSeconds()).padStart(2, '0');

            // 结束时间：结束日期当天 23:59:59
            endDate.setHours(23, 59, 59, 999);
            const endPssj = endDate.getFullYear() + '-' +
                String(endDate.getMonth() + 1).padStart(2, '0') + '-' +
                String(endDate.getDate()).padStart(2, '0') + ' ' +
                String(endDate.getHours()).padStart(2, '0') + ':' +
                String(endDate.getMinutes()).padStart(2, '0') + ':' +
                String(endDate.getSeconds()).padStart(2, '0');

            dataParam.push({ "name": "params[beginPssj]", "value": beginPssj });
            dataParam.push({ "name": "params[endPssj]", "value": endPssj });

            // 提示用户
            $.modal.loading("正在导出数据，请稍候...");

            // POST到导出接口，获取文件名后下载
            $.post('/caseapp/track/export', dataParam, function(result) {
                if (result.code == 0) {
                    window.location.href = ctx + "common/download?fileName=" + encodeURI(result.msg) + "&delete=" + true;
                    $.modal.closeLoading();
                    $.modal.msgSuccess("导出成功！");
                } else {
                    $.modal.closeLoading();
                    $.modal.alertError(result.msg || "导出失败");
                }
            }).fail(function() {
                $.modal.closeLoading();
                $.modal.alertError("导出请求失败，请稍后重试");
            });
        }

            $('#personFilter').val(null).trigger('change');
            $('#specialFilter').val(null).trigger('change');

            // 更新当前筛选条件
            currentFilters = {
                beginDateFilter: firstDayStr,
                endDateFilter: todayStr,
                areaFilter: '',
                statusFilter: '',
                personFilter: [],
                specialFilter: []
            };

            // 重新加载本月的复合事件
            analyzeCompositeEvents();
        }

        // 重新同步所有复合事件
        function syncCompositeEvents() {
            if (!confirm('确定要重新同步所有复合事件吗？\n\n这将根据当前筛选的时间范围，重新计算并覆盖数据库中的复合事件数据。')) {
                return;
            }

            // 获取当前筛选的时间范围
            let beginDateFilter = document.getElementById('beginDateFilter').value;
            let endDateFilter = document.getElementById('endDateFilter').value;

            if (!beginDateFilter || !endDateFilter) {
                alert('请先选择时间范围');
                return;
            }

            const beginDate = new Date(beginDateFilter);
            const endDate = new Date(endDateFilter);

            beginDate.setHours(0, 0, 0, 0);
            const beginPssj = beginDate.getFullYear() + '-' +
                String(beginDate.getMonth() + 1).padStart(2, '0') + '-' +
                String(beginDate.getDate()).padStart(2, '0') + ' 00:00:00';

            endDate.setHours(23, 59, 59, 999);
            const endPssj = endDate.getFullYear() + '-' +
                String(endDate.getMonth() + 1).padStart(2, '0') + '-' +
                String(endDate.getDate()).padStart(2, '0') + ' 23:59:59';

            const formData = new FormData();
            formData.append('params[beginPssj]', beginPssj);
            formData.append('params[endPssj]', endPssj);

            // 显示加载提示
            const loadingMsg = document.createElement('div');
            loadingMsg.innerHTML = '⏳ 正在同步复合事件，请稍候...';
            loadingMsg.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.8); color: white; padding: 20px 40px; border-radius: 8px; z-index: 9999; font-size: 16px;';
            document.body.appendChild(loadingMsg);

            fetch('/caseapp/track/syncCompositeEvents', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                document.body.removeChild(loadingMsg);
                if (data.code === 0) {
                    alert('✅ ' + data.msg);
                    // 重新加载复合事件列表
                    analyzeCompositeEvents();
                } else {
                    alert('❌ 同步失败：' + data.msg);
                }
            })
            .catch(error => {
                document.body.removeChild(loadingMsg);
                console.error('同步复合事件失败:', error);
                alert('❌ 同步失败：' + error);
            });
        }

        // 从后端加载复合事件（基于 qyid=1 的分组）
        // append: 是否追加数据（滚动加载时为true，筛选时为false）
        function analyzeCompositeEvents(append = false) {
            // 如果正在加载或没有更多数据，则返回
            if (isLoading || (!append && !hasMore && currentPage > 1)) {
                return;
            }

            isLoading = true;

            // 如果不是追加模式，重置分页
            if (!append) {
                currentPage = 1;
                hasMore = true;
                compositeEvents = [];
            }
            // 从日期选择框获取最新的筛选条件
            let beginDateFilter = document.getElementById('beginDateFilter').value;
            let endDateFilter = document.getElementById('endDateFilter').value;
            let areaFilter = document.getElementById('areaFilter').value;
            let statusFilter = document.getElementById('statusFilter').value;
            let personFilter = $('#personFilter').val() || [];
            let specialFilter = $('#specialFilter').val() || [];

            // 如果日期为空，使用今天
            if (!beginDateFilter) {
                beginDateFilter = new Date().toISOString().split('T')[0];
            }
            if (!endDateFilter) {
                endDateFilter = beginDateFilter;
            }

            // 更新当前筛选条件
            currentFilters = {
                beginDateFilter: beginDateFilter,
                endDateFilter: endDateFilter,
                areaFilter: areaFilter,
                statusFilter: statusFilter,
                personFilter: personFilter,
                specialFilter: specialFilter
            };

            // 构建时间参数
            let beginDateStr = beginDateFilter;
            let endDateStr = endDateFilter;

            const beginDate = new Date(beginDateStr);
            const endDate = new Date(endDateStr);

            // 开始时间：开始日期当天 0:00:00
            beginDate.setHours(0, 0, 0, 0);
            const beginPssj = beginDate.getFullYear() + '-' +
                String(beginDate.getMonth() + 1).padStart(2, '0') + '-' +
                String(beginDate.getDate()).padStart(2, '0') + ' ' +
                String(beginDate.getHours()).padStart(2, '0') + ':' +
                String(beginDate.getMinutes()).padStart(2, '0') + ':' +
                String(beginDate.getSeconds()).padStart(2, '0');

            // 结束时间：结束日期当天 23:59:59
            endDate.setHours(23, 59, 59, 999);
            const endPssj = endDate.getFullYear() + '-' +
                String(endDate.getMonth() + 1).padStart(2, '0') + '-' +
                String(endDate.getDate()).padStart(2, '0') + ' ' +
                String(endDate.getHours()).padStart(2, '0') + ':' +
                String(endDate.getMinutes()).padStart(2, '0') + ':' +
                String(endDate.getSeconds()).padStart(2, '0');

            // 调用后端接口（使用分页接口）
            const formData = new FormData();
            formData.append('params[beginPssj]', beginPssj);
            formData.append('params[endPssj]', endPssj);
            formData.append('pageNum', currentPage);
            formData.append('pageSize', pageSize);

            // 添加其他筛选条件
            if (areaFilter) {
                formData.append('qymc', areaFilter);
            }
            if (statusFilter) {
                formData.append('bzzt', statusFilter);
            }
            if (personFilter && personFilter.length > 0) {
                // 管理员筛选：后端使用LIKE匹配，这里传递第一个选中的人员
                formData.append('ryxm', personFilter[0]);
            }

            fetch('/caseapp/track/compositeEvents', {
                method: 'POST',
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    isLoading = false;

                    if (data.code === 0) {
                        // 分页接口返回的数据结构: {code: 0, total: xx, rows: []}
                        const rows = data.rows || [];
                        totalCount = data.total || 0;

                        // 检查是否还有更多数据
                        hasMore = rows.length >= pageSize;

                        // 转换后端数据格式为前端需要的格式（分页接口已经按时间排序）
                        const newEvents = rows.map((comp, index) => {
                            // 将后端的事件列表转换为前端格式
                            const events = (comp.events || []).map(item => ({
                                id: item.id,
                                time: formatDateTime(item.pssj),
                                area: item.qymc || '',
                                videoUrl: item.spdz || '',
                                status: item.bzzt === '1' ? 'labeled' : 'unlabeled',
                                reason: item.xwyy || '',
                                reasonDetail: '',
                                persons: [],
                                operator: '',
                                operateTime: item.bzsj || '',
                                spsc: item.spsc || '',
                                pstp: item.pstp || '',
                                rysl: item.rysl || 0, // 人员数量
                                pssj: item.pssj || '', // 原始拍摄时间字符串
                                suggestions: [],
                                // 解析人员信息
                                ryxmList: item.ryxm ? item.ryxm.split(',').filter(p => p && p.trim()) : [],
                                wlryList: item.wlry ? item.wlry.split(',').filter(p => p && p.trim()) : []
                            }));
                            
                            // 合并人员信息
                            events.forEach(event => {
                                event.persons = [...event.ryxmList, ...event.wlryList];
                            });
                            
                            // 确保 bzzt 是字符串类型
                            const bzzt = String(comp.bzzt || '0');

                            // 聚合管理员信息（去重）
                            const allPersons = new Set();
                            events.forEach(event => {
                                event.ryxmList.forEach(p => allPersons.add(p));
                            });
                            const personsArray = Array.from(allPersons);

                            // 获取标注信息（从复合事件本身）
                            const annotationXwyy = comp.xwyy || '';
                            const annotationRyxm = comp.ryxm || '';
                            const annotationWlry = comp.wlry || '';

                            // 聚合区域信息（去重）
                            const allAreas = new Set();
                            events.forEach(event => {
                                if (event.area) allAreas.add(event.area);
                            });
                            const areasArray = Array.from(allAreas);

                            // 检查特殊情况（优先使用后端字段，否则前端计算）
                            const specialTags = [];

                            // 非工作时间：优先使用后端hasNonworktime字段
                            if (comp.hasNonworktime === 1 || comp.hasNonworktime === '1') {
                                specialTags.push('非工作时间');
                            } else {
                                // 前端兜底检查
                                events.forEach(event => {
                                    const eventTime = new Date(event.pssj);
                                    const hour = eventTime.getHours();
                                    if (hour < 8 || hour >= 18) {
                                        if (!specialTags.includes('非工作时间')) {
                                            specialTags.push('非工作时间');
                                        }
                                    }
                                });
                            }

                            // 人员异常：优先使用后端hasAbnormalPerson字段
                            if (comp.hasAbnormalPerson === 1 || comp.hasAbnormalPerson === '1') {
                                specialTags.push('人员异常');
                            } else {
                                // 前端兜底检查：<2人或≥3人
                                events.forEach(event => {
                                    if (event.rysl > 0 && (event.rysl < 2 || event.rysl >= 3)) {
                                        if (!specialTags.includes('人员异常')) {
                                            specialTags.push('人员异常');
                                        }
                                    }
                                });
                            }

                            return {
                                id: comp.eventId || ('COMP' + (index + 1)), // 优先使用真实eventId
                                eventId: comp.eventId, // 保留原始eventId用于其他用途
                                eventIndex: index + 1, // 按时间顺序的编号（从1开始）
                                events: events,
                                startTime: formatDateTime(comp.startTime),
                                endTime: formatDateTime(comp.endTime),
                                path: events.map(e => e.area),
                                eventCount: comp.eventCount,
                                bzzt: bzzt,
                                persons: personsArray, // 聚合的管理员列表
                                areas: areasArray, // 聚合的区域列表
                                specialTags: specialTags, // 特殊标签
                                ryslMax: comp.ryslMax || 0, // 最大人员数量
                                hasNonworktime: comp.hasNonworktime || 0, // 是否包含非工作时间
                                hasAbnormalPerson: comp.hasAbnormalPerson || 0, // 是否人员异常
                                xwyy: annotationXwyy, // 标注的行为原因
                                ryxm: annotationRyxm, // 标注的管理员姓名
                                wlry: annotationWlry  // 标注的外来人员
                            };
                        });

                        // 应用特殊筛选（前端过滤）- 先对新数据筛选
                        let filteredNewEvents = newEvents;
                        if (specialFilter && specialFilter.length > 0) {
                            filteredNewEvents = newEvents.filter(comp => {
                                let matches = false;

                                // 非工作时间筛选
                                if (specialFilter.includes('nonWorktime')) {
                                    if (comp.hasNonworktime === 1 || comp.hasNonworktime === '1' || comp.specialTags.includes('非工作时间')) {
                                        matches = true;
                                    }
                                }

                                // 人员异常筛选
                                if (specialFilter.includes('abnormalPerson')) {
                                    if (comp.hasAbnormalPerson === 1 || comp.hasAbnormalPerson === '1' || comp.specialTags.includes('人员异常')) {
                                        matches = true;
                                    }
                                }

                                return matches;
                            });
                        }

                        // 追加或替换数据（使用筛选后的数据）
                        if (append) {
                            compositeEvents = [...compositeEvents, ...filteredNewEvents];
                        } else {
                            compositeEvents = filteredNewEvents;
                        }

                        // 渲染
                        if (append) {
                            renderCompositeEvents(true);
                        } else {
                            renderCompositeEvents();
                        }

                        updateStats();
                    } else {
                        if (!append) {
                            compositeEvents = [];
                            renderCompositeEvents();
                        }
                        hasMore = false;
                        updateStats();
                    }
                })
                .catch(error => {
                    console.error('获取复合事件失败:', error);
                    isLoading = false;
                    if (!append) {
                        compositeEvents = [];
                        renderCompositeEvents();
                        updateStats();
                    }
                });
        }

        // 检查两个区域是否相邻
        function areAreasAdjacent(area1, area2) {
            if (area1 === area2) return true;
            return areaAdjacency[area1]?.includes(area2) || false;
        }

        // 渲染复合事件
        // append: 是否追加渲染（滚动加载时为true）
        function renderCompositeEvents(append = false) {
            const section = document.getElementById('compositeSection');
            const list = document.getElementById('compositeList');

            if (compositeEvents.length === 0 && !append) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';

            // 计算需要渲染的事件（追加模式只渲染新增的）
            const eventsToRender = append ? compositeEvents.slice(-pageSize) : compositeEvents;

            const htmlContent = eventsToRender.map(comp => {
                const duration = calculateDuration(comp.startTime, comp.endTime);
                const pathStr = comp.path.join(' → ');
                // 确保 bzzt 是字符串类型并正确判断
                const bzzt = String(comp.bzzt || '0');
                const statusBadge = bzzt === '1' ? '<span style="background: #51cf66; color: white; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-left: 8px;">已标注</span>' : '<span style="background: #ff6b6b; color: white; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-left: 8px;">待标注</span>';

                // 显示标注的管理员信息（优先显示标注的，其次显示聚合的）
                const displayPersons = comp.ryxm || (comp.persons && comp.persons.length > 0 ? comp.persons.join('、') : '');
                const personsStr = displayPersons
                    ? `<div style="margin-top: 8px;">👤 管理员：${displayPersons}</div>`
                    : '';

                // 显示外来人员
                const wlryStr = comp.wlry
                    ? `<div style="margin-top: 4px;">🔶 外来人员：${comp.wlry}</div>`
                    : '';

                // 显示行为原因
                const xwyyStr = comp.xwyy
                    ? `<div style="margin-top: 4px; padding: 6px 10px; background: #e7f5ff; border-left: 3px solid #4c6ef5; border-radius: 4px; font-size: 13px;">📝 原因：${comp.xwyy}</div>`
                    : '';

                // 显示备注
                const remarkStr = comp.remark
                    ? `<div style="margin-top: 4px; padding: 6px 10px; background: #fff3cd; border-left: 3px solid #ffc107; border-radius: 4px; font-size: 13px;">💬 备注：${comp.remark}</div>`
                    : '';

                // 显示特殊标签
                const specialTagsHtml = comp.specialTags && comp.specialTags.length > 0
                    ? comp.specialTags.map(tag => {
                        const color = tag === '非工作时间' ? '#ff9800' : '#e91e63';
                        return `<span style="background: ${color}; color: white; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-left: 8px;">⚠️ ${tag}</span>`;
                    }).join('')
                    : '';

                // 显示最大人员数量（如果有异常则高亮显示）
                const ryslMaxHtml = comp.ryslMax > 0
                    ? `<span style="margin-left: 8px; padding: 2px 8px; background: ${comp.hasAbnormalPerson ? '#ffe5e5' : '#e8f5e9'}; color: ${comp.hasAbnormalPerson ? '#d32f2f' : '#2e7d32'}; border-radius: 10px; font-size: 11px; font-weight: bold;">👥 最多${comp.ryslMax}人</span>`
                    : '';

                return `
                    <div class="composite-card" id="composite-card-${comp.eventId}">
                        <div style="display: flex; align-items: flex-start; gap: 10px;">
                            <input type="checkbox" class="composite-checkbox" data-event-id="${comp.eventId}"
                                   style="margin-top: 15px; width: 18px; height: 18px; cursor: pointer;"
                                   onclick="event.stopPropagation();">
                            <div style="flex: 1;">
                                <div class="composite-header" onclick="openCompositeTrace('${comp.id}')">
                                    <div class="composite-title">复合事件 #${comp.eventIndex || (comp.eventId || '')}${statusBadge}${specialTagsHtml}${ryslMaxHtml}</div>
                                    <div class="composite-badge">${comp.eventCount || comp.events.length} 个关联事件</div>
                                </div>
                        <div onclick="openCompositeTrace('${comp.id}')">
                            <div class="composite-path">
                                📍 路径：${pathStr}
                            </div>
                            <div class="composite-time-range">
                                ⏱️ ${comp.startTime} ~ ${comp.endTime.split(' ')[1]} (${duration})
                            </div>
                        </div>
                                <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #e9ecef; display: flex; gap: 10px;">
                                    <button onclick="event.stopPropagation(); annotateCompositeEvent('${comp.eventId}', '${comp.id}')"
                                            style="flex: 1; padding: 8px 16px; background: #4c6ef5; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px;">
                                        ✏️ 标注事件
                                    </button>
                                    <button onclick="event.stopPropagation(); openCompositeTrace('${comp.id}')"
                                            style="flex: 1; padding: 8px 16px; background: #9775fa; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px;">
                                        📊 查看详情

                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // 追加或替换内容
            if (append) {
                list.innerHTML += htmlContent;
            } else {
                list.innerHTML = htmlContent;
            }

            // 添加加载提示
            const existingTip = list.querySelector('.loading-tip');
            if (existingTip) {
                list.removeChild(existingTip);
            }

            if (compositeEvents.length > 0) {
                const loadingTip = document.createElement('div');
                loadingTip.className = 'loading-tip';
                loadingTip.style.cssText = 'text-align: center; padding: 20px; color: #999; font-size: 14px;';

                if (hasMore) {
                    loadingTip.innerHTML = '<p>向下滚动加载更多...</p>';
                } else {
                    loadingTip.innerHTML = '<p>已加载全部数据（共 ' + totalCount + ' 条）</p>';
                }

                list.appendChild(loadingTip);
            }
        }

        // 计算时长
        function calculateDuration(startTime, endTime) {
            const start = new Date(startTime);
            const end = new Date(endTime);
            const diffSeconds = Math.floor((end - start) / 1000); // 秒

            if (diffSeconds < 60) {
                return `${diffSeconds}秒`;
            } else if (diffSeconds < 3600) {
                const mins = Math.floor(diffSeconds / 60);
                const secs = diffSeconds % 60;
                return `${mins}分${secs}秒`;
            } else {
                const hours = Math.floor(diffSeconds / 3600);
                const mins = Math.floor((diffSeconds % 3600) / 60);
                const secs = diffSeconds % 60;
                return `${hours}小时${mins}分${secs}秒`;
            }
        }

            const endDate = currentFilters.endDateFilter || document.getElementById('endDateFilter').value || beginDate;
            window.location.href = '/caseapp/track/compositeTrace?id=' + compositeId + '&beginDate=' + beginDate + '&endDate=' + endDate;
        }

                return;
            }

                alert('请先选择要导出的复合事件');

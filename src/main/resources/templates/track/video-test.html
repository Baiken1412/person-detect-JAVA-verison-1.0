<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>视频路径测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
        }
        video {
            width: 100%;
            max-width: 600px;
            background: #000;
        }
        .result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>🎬 视频路径测试页面</h1>

    <div class="test-section">
        <h2>测试 1：直接路径 /test.mp4</h2>
        <video id="video1" controls muted>
            <source src="/test.mp4" type="video/mp4">
        </video>
        <div id="result1" class="result"></div>
        <button onclick="testVideo('video1', '/test.mp4', 'result1')">重新测试</button>
    </div>

    <div class="test-section">
        <h2>测试 2：相对路径 test.mp4</h2>
        <video id="video2" controls muted>
            <source src="test.mp4" type="video/mp4">
        </video>
        <div id="result2" class="result"></div>
        <button onclick="testVideo('video2', 'test.mp4', 'result2')">重新测试</button>
    </div>

    <div class="test-section">
        <h2>测试 3：完整路径（如果有应用上下文）</h2>
        <video id="video3" controls muted>
            <source src="/caseapp/test.mp4" type="video/mp4">
        </video>
        <div id="result3" class="result"></div>
        <button onclick="testVideo('video3', '/caseapp/test.mp4', 'result3')">重新测试</button>
    </div>

    <div class="test-section">
        <h2>测试 4：static路径</h2>
        <video id="video4" controls muted>
            <source src="/static/test.mp4" type="video/mp4">
        </video>
        <div id="result4" class="result"></div>
        <button onclick="testVideo('video4', '/static/test.mp4', 'result4')">重新测试</button>
    </div>

    <div class="test-section">
        <h2>📋 当前页面信息</h2>
        <div id="pageInfo"></div>
    </div>

    <script>
        // 显示页面信息
        document.getElementById('pageInfo').innerHTML = `
            <strong>当前URL:</strong> ${window.location.href}<br>
            <strong>协议:</strong> ${window.location.protocol}<br>
            <strong>主机:</strong> ${window.location.host}<br>
            <strong>路径:</strong> ${window.location.pathname}<br>
            <strong>基础路径:</strong> ${window.location.origin}
        `;

        // 测试视频
        function testVideo(videoId, path, resultId) {
            const video = document.getElementById(videoId);
            const result = document.getElementById(resultId);

            result.innerHTML = '⏳ 测试中...';
            result.className = 'result';

            video.src = path;

            video.onerror = (e) => {
                console.error(`测试失败 - ${path}:`, e);
                result.innerHTML = `❌ 加载失败<br>路径: ${path}<br>错误: 文件不存在或格式不支持`;
                result.className = 'result error';
            };

            video.onloadeddata = () => {
                console.log(`测试成功 - ${path}`);
                result.innerHTML = `✅ 加载成功！<br>路径: ${path}<br>时长: ${video.duration.toFixed(2)}秒`;
                result.className = 'result success';
            };

            // 尝试播放
            video.play().catch(e => {
                console.error(`播放失败 - ${path}:`, e);
            });
        }

        // 页面加载时自动测试
        window.onload = () => {
            console.log('开始自动测试所有路径...');
            testVideo('video1', '/test.mp4', 'result1');
            setTimeout(() => testVideo('video2', 'test.mp4', 'result2'), 1000);
            setTimeout(() => testVideo('video3', '/caseapp/test.mp4', 'result3'), 2000);
            setTimeout(() => testVideo('video4', '/static/test.mp4', 'result4'), 3000);
        };
    </script>
</body>
</html>

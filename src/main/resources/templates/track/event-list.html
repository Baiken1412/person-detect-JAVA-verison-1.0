<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>事件标注 - 资产库区视频治理插件</title>
    <link th:href="@{/css/font-awesome.min.css?v=4.7.0}" rel="stylesheet"/>
    <th:block th:include="include :: select2-css" />
    <th:block th:include="include :: bootstrap-select-css" />
    <link th:href="@{/css/button-animations.css}" rel="stylesheet"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        .header {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            color: white;
            padding: 40px 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            border-radius: 50%;
        }

        .header-content {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-logo {
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        .header-logo img {
            height: 80px;
            width: auto;
            mix-blend-mode: multiply;
        }

        .header-text h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header-text p {
            font-size: 16px;
            opacity: 0.95;
            letter-spacing: 1px;
        }

        .footer {
            background: #2c3e50;
            color: #ecf0f1;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            font-size: 14px;
        }

        .footer a {
            color: #3498db;
            text-decoration: none;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 4px solid #2a5298;
        }

        .stat-card h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .stat-card .number {
            font-size: 28px;
            font-weight: bold;
            color: #2a5298;
        }

        .toolbar {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }

        .toolbar > div {
            display: flex;
            align-items: center;
        }

        .toolbar > div:nth-child(2) { min-width: 250px; }
        .toolbar > div:nth-child(3) { min-width: 200px; }
        .toolbar > div:nth-child(4) { min-width: 200px; }
        .toolbar > div:nth-child(5) { min-width: 200px; }

        .toolbar label {
            font-size: 14px;
            color: #666;
            margin-right: 8px;
            white-space: nowrap;
        }

        .toolbar input[type="date"],
        .toolbar select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .toolbar .select2-container {
            vertical-align: middle;
        }

        .toolbar .select2-selection {
            height: auto;
            min-height: 38px;
            display: flex;
            align-items: center;
        }

        .toolbar .select2-selection__rendered {
            line-height: 38px;
        }

        .toolbar button {
            padding: 8px 20px;
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .toolbar button:hover {
            background: #1e3c72;
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .event-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .event-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }

        .event-card.unlabeled {
            border: 2px solid #ff6b6b;
        }

        .event-card.labeled {
            border: 2px solid #51cf66;
        }

        .event-card.worktime-warning {
            border: 3px solid #ff6b6b;
            background: linear-gradient(135deg, #fff5f5 0%, #ffffff 100%);
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
        }

        .worktime-warning-badge {
            display: inline-block;
            background: #ff6b6b;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 8px;
        }

        .event-thumbnail {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
            position: relative;
            overflow: hidden;
        }

        .event-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .event-status {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .event-status.unlabeled {
            background: #ff6b6b;
            color: white;
        }

        .event-status.labeled {
            background: #51cf66;
            color: white;
        }

        .event-info {
            padding: 15px;
        }

        .event-time {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .event-location {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }

        .event-location::before {
            content: "\f041"; /* Font Awesome map-marker */
            font-family: FontAwesome;
            margin-right: 5px;
        }

        .event-reason {
            font-size: 13px;
            color: #888;
            padding: 5px 10px;
            background: #f8f9fa;
            border-radius: 4px;
            display: inline-block;
        }

        .event-suggestion {
            font-size: 12px;
            color: #ff9800;
            padding: 8px 10px;
            background: #fff3e0;
            border-radius: 4px;
            margin-top: 8px;
            border-left: 3px solid #ff9800;
        }

        .event-suggestion::before {
            content: "\f0eb "; /* Font Awesome lightbulb */
            font-family: FontAwesome;
        }

        .no-events {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            grid-column: 1 / -1;
        }

        .no-events svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* 分页样式 */
        .pagination-container {
            margin-top: 30px;
            display: flex;
            justify-content: center;
        }

        .pagination {
            display: flex;
            list-style: none;
            padding: 0;
            gap: 5px;
        }

        .pagination li a {
            color: #333;
            float: left;
            padding: 8px 16px;
            text-decoration: none;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            background-color: white;
            transition: all 0.3s;
            user-select: none;
        }

        .pagination li.active a {
            background-color: #2a5298;
            color: white;
            border-color: #2a5298;
        }

        .pagination li.disabled a {
            color: #ccc;
            cursor: not-allowed;
            background-color: #f9f9f9;
            pointer-events: none;
        }

        .pagination li a:hover:not(.active):not(.disabled-link) {
            background-color: #eee;
        }

        /* 退出登录按钮样式 */
        .logout-button {
            background: #ff9800 !important;
            border: 1px solid #ff9800 !important;
            color: white !important;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 2px 4px rgba(255, 152, 0, 0.3);
        }

        .logout-button:hover {
            background: #f57c00 !important;
            border-color: #f57c00 !important;
            box-shadow: 0 4px 8px rgba(255, 152, 0, 0.4);
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            .header { padding: 30px 20px; }
            .header-content { flex-direction: column; text-align: center; }
            .events-grid { grid-template-columns: 1fr; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .toolbar > * { width: 100%; }
        }
    </style>
</head>
<body>
<div class="header">
    <div class="header-content">
        <div class="header-logo"><img src="/图片1.png" alt="系统Logo"></div>
        <div class="header-text">
            <h1 id="systemTitle">资产库区视频治理插件</h1>
            <p id="systemSubtitle">人员活动自动识别与追溯管理系统</p>
        </div>
        <div style="margin-left: auto; display: flex; gap: 10px;">
            <button onclick="goToCompositeEvents()" style="background: rgba(255,255,255,0.2); border: 1px solid white; color: white; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; transition: background 0.3s;">
                <i class="fa fa-home"></i> 事件页面
            </button>
            <button style="background: rgba(255,255,255,0.4); border: 1px solid white; color: white; padding: 10px 20px; border-radius: 4px; cursor: default; font-size: 14px; font-weight: bold;">
                <i class="fa fa-list"></i> 轨迹页面
            </button>
            <button onclick="goToDailyReport()" style="background: rgba(255,255,255,0.2); border: 1px solid white; color: white; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; transition: background 0.3s;">
                <i class="fa fa-bar-chart"></i> 每日报告
            </button>
            <button onclick="goToShelfTrajectory()" style="background: rgba(255,255,255,0.2); border: 1px solid white; color: white; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; transition: background 0.3s;">
                <i class="fa fa-cube"></i> 货位位置查询
            </button>
            <a th:href="@{/logout}" class="logout-button">
                <i class="fa fa-sign-out"></i> 退出登录
            </a>
        </div>
    </div>
</div>

<div class="container">
    <div class="stats-bar">
        <div class="stat-card">
            <h3><i class="fa fa-bar-chart"></i> 今日事件总数</h3>
            <div class="number" id="todayTotal">0</div>
        </div>
        <div class="stat-card">
            <h3><i class="fa fa-clock-o"></i> 待标注事件</h3>
            <div class="number" id="unlabeledCount">0</div>
        </div>
        <div class="stat-card">
            <h3><i class="fa fa-check"></i> 已标注事件</h3>
            <div class="number" id="labeledCount">0</div>
        </div>
        <div class="stat-card">
            <h3><i class="fa fa-calendar"></i> 本月事件总数</h3>
            <div class="number" id="monthTotal">0</div>
        </div>
    </div>

    <div class="toolbar">
        <div>
            <label for="beginDateFilter"><i class="fa fa-calendar"></i> 日期筛选：</label>
            <input type="date" id="beginDateFilter">
            <span style="margin: 0 5px;">至</span>
            <input type="date" id="endDateFilter">
        </div>
        <div>
            <label for="areaFilter"><i class="fa fa-map-marker"></i> 区域筛选：</label>
            <select id="areaFilter" class="form-control noselect2">
                <option value="">全部区域</option>
            </select>
        </div>
        <div>
            <label for="statusFilter"><i class="fa fa-tag"></i> 状态筛选：</label>
            <select id="statusFilter" class="form-control noselect2">
                <option value="">全部状态</option>
            </select>
        </div>
        <div>
            <label for="personFilter"><i class="fa fa-user"></i> 管理员筛选：</label>
            <select id="personFilter" class="form-control noselect2" multiple>
            </select>
        </div>
        <div>
            <label for="specialFilter"><i class="fa fa-warning"></i> 特殊筛选：</label>
            <select id="specialFilter" class="form-control noselect2" multiple>
                <option value="nonWorktime">非工作时间提示</option>
                <option value="abnormalPerson">人员异常数量</option>
                <option value="longTrack">轨迹时间过长</option>
            </select>
        </div>
        <button onclick="applyFilters()"><i class="fa fa-search"></i> 筛选</button>
        <button onclick="resetFilters()"><i class="fa fa-refresh"></i> 重置</button>
    </div>

    <div class="events-grid" id="eventsGrid">
    </div>

    <div class="pagination-container">
        <ul class="pagination" id="pagination">
        </ul>
    </div>

    <div id="eventDetailModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 9999; justify-content: center; align-items: center;">
        <div style="background: white; border-radius: 12px; width: 90%; max-width: 1000px; max-height: 90vh; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.3);">
            <div style="background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%); color: white; padding: 24px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #3498db;">
                <div>
                    <h2 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: 0.5px;">
                        <i class="fa fa-file-text-o"></i> 活动轨迹详情
                    </h2>
                    <p style="margin: 5px 0 0 0; font-size: 13px; opacity: 0.8;">Activity Trajectory Details</p>
                </div>
                <button onclick="closeEventDetailModal()" style="background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: white; font-size: 24px; width: 40px; height: 40px; border-radius: 8px; cursor: pointer; transition: all 0.3s;" onmouseover="this.style.background='rgba(255,255,255,0.25)'" onmouseout="this.style.background='rgba(255,255,255,0.15)'">×</button>
            </div>
            <div id="eventDetailContent" style="padding: 30px; max-height: calc(90vh - 120px); overflow-y: auto;"></div>
        </div>
    </div>

    <div id="imageViewerModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); z-index: 10000; justify-content: center; align-items: center;">
        <div style="position: relative; width: 90%; height: 90%; display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <button onclick="closeImageViewer()" style="position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: white; font-size: 32px; width: 50px; height: 50px; border-radius: 8px; cursor: pointer; transition: all 0.3s; z-index: 10001;">×</button>
            <button id="prevImageBtn" onclick="navigateImage(-1)" style="position: absolute; left: 30px; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: white; font-size: 40px; width: 60px; height: 60px; border-radius: 8px; cursor: pointer; transition: all 0.3s; z-index: 10001;">‹</button>
            <div style="flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; position: relative;">
                <img id="viewerImage" src="" style="max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);">
            </div>
            <button id="nextImageBtn" onclick="navigateImage(1)" style="position: absolute; right: 30px; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: white; font-size: 40px; width: 60px; height: 60px; border-radius: 8px; cursor: pointer; transition: all 0.3s; z-index: 10001;">›</button>
            <div style="margin-top: 20px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 15px 30px; border-radius: 8px; color: white; display: flex; justify-content: space-between; align-items: center; min-width: 400px;">
                <div>
                    <span id="imageCounter" style="font-size: 16px; font-weight: bold;">1 / 1</span>
                    <span style="margin: 0 15px; opacity: 0.5;">|</span>
                    <span id="imageInfo" style="font-size: 14px; opacity: 0.9;">第 1 次检测</span>
                </div>
                <div id="imageTime" style="font-size: 13px; opacity: 0.8;"></div>
            </div>
        </div>
    </div>
</div>

<div class="footer">
    Copyright © 2023-2024 某科技公司 版权所有
</div>

<script>
    // 事件数据
    let eventsData = []; // 事件数据
    let currentPage = 1; // 当前页码
    let pageSize = 8; // 每页显示数量
    let totalCount = 0; // 总记录数
    let isLoading = false; // 是否正在加载
    let currentFilters = {}; // 当前筛选条件

    // 图片浏览器变量
    let currentImageIndex = 0;
    let currentScreenshots = [];

    // 加载系统配置
    function loadSystemConfig() {
        fetch('/system/config/info')
            .then(response => response.json())
            .then(data => {
                if (data.code === 0 && data.data) {
                    document.getElementById('systemTitle').textContent = data.data.title;
                    document.getElementById('systemSubtitle').textContent = data.data.subtitle;
                    document.title = '轨迹页面 - ' + data.data.title;
                }
            })
            .catch(error => console.error('加载系统配置失败:', error));
    }

    // 初始化页面
    function init() {
        loadSystemConfig();
        updateStats();
        loadAreaList();
        loadDictData();
        loadPersonList();

        const today = new Date();
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);

        const yesterdayStr = yesterday.toISOString().split('T')[0];
        const todayStr = today.toISOString().split('T')[0];

        document.getElementById('beginDateFilter').value = yesterdayStr;
        document.getElementById('endDateFilter').value = todayStr;

        currentFilters = {
            beginDateFilter: yesterdayStr,
            endDateFilter: todayStr,
            areaFilter: '',
            statusFilter: '',
            personFilter: [],
            specialFilter: []
        };

        $('#specialFilter').select2({
            width: '200px',
            placeholder: '请选择特殊筛选',
            allowClear: true
        });

        // 加载第一页数据
        loadEvents(yesterdayStr, todayStr, '', '', [], 1, false);
    }

    // 渲染分页组件
    function renderPagination(total, page, size) {
        const totalPages = Math.ceil(total / size);
        const pagination = document.getElementById('pagination');
        let html = '';

        if (totalPages <= 1) {
            pagination.innerHTML = '';
            return;
        }

        // 上一页
        const prevDisabled = page === 1 ? 'disabled' : '';
        html += `<li class="${prevDisabled}"><a onclick="${page > 1 ? `changePage(${page - 1})` : ''}">«</a></li>`;

        // 页码显示逻辑 (1..当前..末页)
        let startPage = Math.max(1, page - 2);
        let endPage = Math.min(totalPages, page + 2);

        if (startPage > 1) {
            html += `<li><a onclick="changePage(1)">1</a></li>`;
            if (startPage > 2) html += `<li class="disabled"><a class="disabled-link">...</a></li>`;
        }

        for (let i = startPage; i <= endPage; i++) {
            const active = i === page ? 'active' : '';
            html += `<li class="${active}"><a onclick="changePage(${i})">${i}</a></li>`;
        }

        if (endPage < totalPages) {
            if (endPage < totalPages - 1) html += `<li class="disabled"><a class="disabled-link">...</a></li>`;
            html += `<li><a onclick="changePage(${totalPages})">${totalPages}</a></li>`;
        }

        // 下一页
        const nextDisabled = page === totalPages ? 'disabled' : '';
        html += `<li class="${nextDisabled}"><a onclick="${page < totalPages ? `changePage(${page + 1})` : ''}">»</a></li>`;

        pagination.innerHTML = html;
    }

    // 切换页码
    function changePage(newPage) {
        // 滚动到顶部
        document.querySelector('.header').scrollIntoView({behavior: 'smooth'});
        // 加载新页数据 (append = false, 替换模式)
        loadEvents(
            currentFilters.beginDateFilter,
            currentFilters.endDateFilter,
            currentFilters.areaFilter,
            currentFilters.statusFilter,
            currentFilters.personFilter,
            newPage,
            false
        );
    }

    // 加载字典数据
    function loadDictData() {
        fetch('/caseapp/track/dict/biz_annotation_status')
            .then(response => response.json())
            .then(data => {
                const statusFilter = document.getElementById('statusFilter');
                statusFilter.innerHTML = '<option value="">全部状态</option>';
                const options = (data.code === 0 && data.data && data.data.length > 0)
                    ? data.data
                    : [{dictValue: '0', dictLabel: '未标注'}, {dictValue: '1', dictLabel: '已标注'}];

                const uniqueData = new Map();
                options.forEach(item => {
                    if (!uniqueData.has(item.dictValue)) uniqueData.set(item.dictValue, item);
                });

                uniqueData.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item.dictValue;
                    option.textContent = item.dictLabel;
                    statusFilter.appendChild(option);
                });

                $('#statusFilter').select2({ width: '200px', placeholder: '请选择状态' });
            })
            .catch(() => {
                $('#statusFilter').select2({ width: '200px', placeholder: '请选择状态' });
            });
    }

    // 加载区域列表
    function loadAreaList() {
        fetch('/caseapp/roomip/areas', { method: 'POST' })
            .then(response => response.json())
            .then(data => {
                if (data.code === 0 && data.data) {
                    const areaFilter = document.getElementById('areaFilter');
                    areaFilter.innerHTML = '<option value="">全部区域</option>';
                    data.data.forEach(area => {
                        const option = document.createElement('option');
                        option.value = area;
                        option.textContent = area;
                        areaFilter.appendChild(option);
                    });
                    $('#areaFilter').select2({ width: '250px', placeholder: '请选择区域' });
                }
            });
    }

    // 加载人员列表
    function loadPersonList() {
        fetch('/caseapp/person/persons', { method: 'POST' })
            .then(response => response.json())
            .then(data => {
                if (data.code === 0 && data.data) {
                    const personFilter = document.getElementById('personFilter');
                    if ($('#personFilter').data('select2')) $('#personFilter').select2('destroy');
                    personFilter.innerHTML = '';
                    data.data.forEach(person => {
                        const option = document.createElement('option');
                        option.value = person;
                        option.textContent = person;
                        personFilter.appendChild(option);
                    });
                    $('#personFilter').select2({
                        width: '200px',
                        placeholder: '请选择管理员',
                        allowClear: true,
                        multiple: true
                    });
                }
            });
    }

    // 加载事件列表
    function loadEvents(beginDateFilter, endDateFilter, areaFilter, statusFilter, personFilter, pageNum, append) {
        if (isLoading) return;
        isLoading = true;
        const formData = new FormData();
        formData.append('pageNum', pageNum || 1);
        formData.append('pageSize', pageSize);
        if (statusFilter) formData.append('bzzt', statusFilter);
        if (areaFilter) formData.append('qymc', areaFilter);
        if (personFilter && personFilter.length > 0) formData.append('ryxm', personFilter.join(','));

        let beginDateStr = beginDateFilter || new Date().toISOString().split('T')[0];
        let endDateStr = endDateFilter || beginDateStr;
        const beginDate = new Date(beginDateStr);
        const endDate = new Date(endDateStr);
        beginDate.setHours(0, 0, 0, 0);
        endDate.setHours(23, 59, 59, 999);

        const formatDate = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;

        formData.append('params[beginPssj]', formatDate(beginDate));
        formData.append('params[endPssj]', formatDate(endDate));

        // 轨迹页面包含收物室轨迹
        formData.append('includeReceivingRoom', 'true');

        fetch('/caseapp/track/compositeEvents', { method: 'POST', body: formData })
            .then(response => response.json())
            .then(data => {
                isLoading = false;
                if (data.code === 0 && data.rows) {
                    totalCount = data.total || 0;
                    // 将每个复合事件中的所有轨迹都展开成独立的事件卡片
                    const newEvents = [];
                    data.rows.forEach(item => {
                        // 如果复合事件包含多个轨迹，为每个轨迹创建一个卡片
                        if (item.events && item.events.length > 0) {
                            item.events.forEach((track, index) => {
                                newEvents.push({
                                    id: item.id,  // 复合事件ID
                                    trackId: track.id,  // 轨迹ID
                                    compositeId: item.id,  // 保存复合事件ID用于跳转
                                    trackIndex: index + 1,  // 轨迹序号（用于显示"轨迹 1/3"）
                                    totalTracks: item.events.length,  // 总轨迹数
                                    time: formatDateTime(track.pssj || item.startTime),
                                    endTime: formatDateTime(track.jssj || item.endTime),
                                    area: track.qymc || item.qymc || '',
                                    videoUrl: track.spdz || '',
                                    status: item.bzzt === '1' ? 'labeled' : 'unlabeled',
                                    reason: (item.xwyy && item.xwyy.includes('：')) ? item.xwyy.split('：', 2)[0] : (item.xwyy || ''),
                                    reasonDetail: (item.xwyy && item.xwyy.includes('：')) ? item.xwyy.split('：', 2)[1] : '',
                                    persons: [item.ryxm, item.wlry].filter(Boolean),
                                    operator: item.bzzt === '1' ? (item.ryxm || '') : '',
                                    operateTime: item.bzsj || '',
                                    spsc: track.spsc || '',
                                    pstp: track.pstp || '',
                                    rysl: track.rysl || item.ryslMax || 0,
                                    pssj: track.pssj || item.startTime || '',
                                    jssj: track.jssj || item.endTime || '',
                                    suggestions: [],
                                    ryxm: item.ryxm || '',
                                    wlry: item.wlry || '',
                                    remark: item.remark || '',
                                    hasLongTrack: item.hasLongTrack || 0,
                                    hasLongEvent: item.hasLongEvent || 0
                                });
                            });
                        } else {
                            // 如果没有轨迹信息，保留原有逻辑
                            newEvents.push({
                                id: item.id,
                                trackId: item.id,
                                compositeId: item.id,
                                trackIndex: 1,
                                totalTracks: 1,
                                time: formatDateTime(item.startTime),
                                endTime: formatDateTime(item.endTime),
                                area: item.qymc || '',
                                videoUrl: '',
                                status: item.bzzt === '1' ? 'labeled' : 'unlabeled',
                                reason: (item.xwyy && item.xwyy.includes('：')) ? item.xwyy.split('：', 2)[0] : (item.xwyy || ''),
                                reasonDetail: (item.xwyy && item.xwyy.includes('：')) ? item.xwyy.split('：', 2)[1] : '',
                                persons: [item.ryxm, item.wlry].filter(Boolean),
                                operator: item.bzzt === '1' ? (item.ryxm || '') : '',
                                operateTime: item.bzsj || '',
                                spsc: '',
                                pstp: '',
                                rysl: item.ryslMax || 0,
                                pssj: item.startTime || '',
                                jssj: item.endTime || '',
                                suggestions: [],
                                ryxm: item.ryxm || '',
                                wlry: item.wlry || '',
                                remark: item.remark || '',
                                hasLongTrack: item.hasLongTrack || 0,
                                hasLongEvent: item.hasLongEvent || 0
                            });
                        }
                    });

                    if (append) {
                        eventsData = eventsData.concat(newEvents);
                    } else {
                        eventsData = newEvents;
                    }
                    currentPage = pageNum || 1;

                    // 应用特殊筛选
                    let filteredEvents = eventsData;
                    let filteredNewEvents = newEvents;
                    if (currentFilters.specialFilter && currentFilters.specialFilter.length > 0) {
                        filteredEvents = filterEventsBySpecial(eventsData, currentFilters.specialFilter);
                        if (append) filteredNewEvents = filterEventsBySpecial(newEvents, currentFilters.specialFilter);
                    }

                    renderEvents(filteredEvents, append, filteredNewEvents);

                    // 渲染分页条
                    renderPagination(totalCount, currentPage, pageSize);
                } else {
                    if (!append) {
                        eventsData = [];
                        renderEvents([]);
                        document.getElementById('pagination').innerHTML = ''; // 清空分页
                    }
                }
            })
            .catch(error => {
                isLoading = false;
                console.error('获取事件列表失败:', error);
                if (!append) {
                    eventsData = [];
                    renderEvents([]);
                    document.getElementById('pagination').innerHTML = '';
                }
            });
    }

    // 格式化日期时间
    function formatDateTime(dateStr) {
        if (!dateStr) return '';
        const date = new Date(dateStr);
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}:${String(date.getSeconds()).padStart(2, '0')}`;
    }
    function formatTime(dateStr) {
        if (!dateStr) return '-';
        const date = new Date(dateStr);
        return `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}:${String(date.getSeconds()).padStart(2, '0')}`;
    }

    // 警告判定逻辑
    function isNonWorktimeWarning(event) {
        if (!event.pssj) return false;
        const hour = new Date(event.pssj).getHours();
        if (hour >= 9 && hour < 18) return false;
        return (!event.rysl || event.rysl < 1) ? false : true;
    }

    function isAbnormalPersonCount(event) {
        if (!event.rysl || event.rysl === 0) return false;
        return event.rysl < 2 || event.rysl >= 3;
    }

    function filterEventsBySpecial(events, specialFilters) {
        if (!specialFilters || specialFilters.length === 0) return events;
        return events.filter(event => {
            let matches = false;
            if (specialFilters.includes('nonWorktime') && isNonWorktimeWarning(event)) matches = true;
            if (specialFilters.includes('abnormalPerson') && isAbnormalPersonCount(event)) matches = true;
            if (specialFilters.includes('longTrack') && event.hasLongTrack === 1) matches = true;
            return matches;
        });
    }

    // 更新统计数据
    function updateStats() {
        fetch('/caseapp/track/stats')
            .then(response => response.json())
            .then(data => {
                if (data.code === 0) {
                    document.getElementById('todayTotal').textContent = data.todayTotal || 0;
                    document.getElementById('unlabeledCount').textContent = data.unlabeledCount || 0;
                    document.getElementById('labeledCount').textContent = data.labeledCount || 0;
                    document.getElementById('monthTotal').textContent = data.monthTotal || 0;
                }
            })
            .catch(() => {});
    }

    // 渲染事件列表
    function renderEvents(events, append = false, newEvents = null) {
        const grid = document.getElementById('eventsGrid');
        if (events.length === 0 && !append) {
            grid.innerHTML = `
                    <div class="no-events">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <p>暂无事件记录</p>
                    </div>`;
            return;
        }

        const eventsToRender = append && newEvents ? newEvents : events;
        const eventsHTML = eventsToRender.map(event => {
            const isNonWorktime = isNonWorktimeWarning(event);
            const isAbnormal = isAbnormalPersonCount(event);
            const isLongTrack = event.hasLongTrack === 1;
            const warningClass = (isNonWorktime || isAbnormal || isLongTrack) ? 'worktime-warning' : '';

            // 构建跳转URL，带上复合事件ID
            const detailUrl = `/caseapp/track/detail/${event.trackId}?compositeId=${event.compositeId}`;

            return `
                <div class="event-card ${event.status} ${warningClass}" onclick="window.location.href='${detailUrl}'" style="cursor: pointer;">
                    <div class="event-thumbnail">
                        ${event.pstp ? `<img src="${event.pstp}" alt="缩略图" onerror="this.onerror=null; this.src=''; this.style.display='none'; this.nextElementSibling.style.display='inline-block';" /><span class="thumbnail-icon" style="display:none;">🎥</span>` : '<span class="thumbnail-icon">🎥</span>'}
                        <span class="event-status ${event.status}">${event.status === 'unlabeled' ? '待标注' : '已标注'}</span>
                        ${event.totalTracks > 1 ? `<span class="track-indicator" style="position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.7); color: white; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 500;">轨迹 ${event.trackIndex}/${event.totalTracks}</span>` : ''}
                    </div>
                    <div class="event-info">
                        <div class="event-time">${event.time}</div>
                        <div class="event-location">${event.area} ${event.rysl ? `（${event.rysl}人）` : ''}</div>
                        ${isAbnormal ? `<div class="worktime-warning-badge" style="background: #e74c3c;"><i class="fa fa-warning"></i> 人员数量异常</div>` : ''}
                        ${isNonWorktime ? `<div class="worktime-warning-badge" style="background: #ff9800;"><i class="fa fa-warning"></i> 非工作时间</div>` : ''}
                        ${isLongTrack ? `<div class="worktime-warning-badge" style="background: #9b59b6;"><i class="fa fa-clock-o"></i> 轨迹时间过长</div>` : ''}
                        ${event.status === 'labeled' ? `
                            ${event.persons.length > 0 ? `<div class="event-reason"><i class="fa fa-user"></i> ${event.persons.join('、')}</div>` : ''}
                            <div class="event-reason">${event.reason === '其他' ? event.reason + '：' + event.reasonDetail : event.reason}</div>
                        ` : '<div class="event-reason">待标注原因</div>'}
                    </div>
                </div>`;
        }).join('');

        if (append) grid.insertAdjacentHTML('beforeend', eventsHTML);
        else grid.innerHTML = eventsHTML;
    }

    // 查看轨迹详情（显示复合事件的所有轨迹）
    function viewEventDetail(eventId) {
        document.getElementById('eventDetailContent').innerHTML = `<div style="text-align: center; padding: 40px; color: #999;"><i class="fa fa-spinner fa-spin" style="font-size: 24px; margin-bottom: 10px;"></i><p>加载中...</p></div>`;
        document.getElementById('eventDetailModal').style.display = 'flex';

        // 设置超时控制
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000); // 10秒超时

        // 使用复合事件详情接口（显示该事件的所有轨迹）
        fetch('/caseapp/track/compositeEvents/' + eventId, { signal: controller.signal })
            .then(response => {
                clearTimeout(timeoutId);
                if (!response.ok) {
                    throw new Error('网络响应错误: ' + response.status);
                }
                return response.json();
            })
            .then(data => {
                if (data.code === 0 && data.data) {
                    const composite = data.data;
                    const tracks = composite.events || [];

                    // 收集所有轨迹的截图
                    const allScreenshots = [];
                    tracks.forEach(track => {
                        if (track.screenshots && track.screenshots.length > 0) {
                            allScreenshots.push(...track.screenshots);
                        }
                    });
                    window.currentTrajectoryScreenshots = allScreenshots;

                    let detailHTML = `<div style="line-height: 1.8;">`;

                    // 复合事件基本信息
                    detailHTML += `
                        <div style="margin-bottom: 20px; background: #f0f7ff; border-radius: 8px; padding: 15px; border-left: 4px solid #2a5298;">
                            <div style="font-weight: bold; font-size: 16px; color: #2a5298; margin-bottom: 10px;">
                                <i class="fa fa-info-circle"></i> 复合事件信息
                            </div>
                            <div style="font-size: 14px; line-height: 2;">
                                <strong><i class="fa fa-list-ol"></i> 包含轨迹:</strong> ${tracks.length} 个 <br>
                                <strong><i class="fa fa-map-signs"></i> 活动路径:</strong> ${tracks.map(t => t.qymc).filter(Boolean).join(' → ')} <br>
                                <strong><i class="fa fa-tag"></i> 标注状态:</strong> ${composite.bzzt === '1' ? '<span style="color: #51cf66;">已标注</span>' : '<span style="color: #ff6b6b;">待标注</span>'}
                            </div>
                        </div>`;

                    // 标注信息
                    if (composite.bzzt === '1') {
                        detailHTML += `
                            <div style="margin-bottom: 20px; background: #f8f9fa; border-radius: 8px; padding: 15px;">
                                <div style="font-weight: bold; margin-bottom: 10px;"><i class="fa fa-edit"></i> 标注信息</div>
                                <div style="font-size: 14px; line-height: 2;">
                                    <strong><i class="fa fa-pencil"></i> 行为原因:</strong> ${composite.xwyy || '未填写'} <br>
                                    <strong><i class="fa fa-user"></i> 管理员:</strong> ${composite.ryxm || '未填写'} <br>
                                    <strong><i class="fa fa-users"></i> 外来人员:</strong> ${composite.wlry || '无'} <br>
                                    <strong><i class="fa fa-comment"></i> 备注:</strong> ${composite.remark || '无'}
                                </div>
                            </div>`;
                    }

                    // 显示每个轨迹的视频和截图
                    tracks.forEach((track, index) => {
                        detailHTML += `
                            <div style="margin-bottom: 20px; background: #f8f9fa; border-radius: 8px; padding: 15px;">
                                <div style="font-weight: bold; margin-bottom: 12px;">
                                    <i class="fa fa-video-camera"></i> 轨迹 ${index + 1} - ${track.qymc || '未知区域'}
                                    <span style="font-size: 12px; color: #666; font-weight: normal; margin-left: 10px;">
                                        ${formatDateTime(track.pssj)} ~ ${formatDateTime(track.jssj)}
                                    </span>
                                </div>`;

                        if (track.spdz) {
                            detailHTML += `
                                <div style="background: #000; border-radius: 6px; overflow: hidden; margin-bottom: 10px;">
                                    <video controls style="width: 100%; max-height: 350px; display: block;">
                                        <source src="${track.spdz}" type="video/mp4">
                                        您的浏览器不支持视频播放。
                                    </video>
                                </div>`;
                        }

                        if (track.screenshots && track.screenshots.length > 0) {
                            detailHTML += `
                                <div style="margin-top: 10px;">
                                    <strong style="font-size: 13px;"><i class="fa fa-camera"></i> 截图 (${track.screenshots.length})</strong>
                                    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-top: 8px;">
                                        ${track.screenshots.map((s, i) => {
                                            const globalIndex = allScreenshots.findIndex(ss => ss.id === s.id);
                                            return `
                                                <div onclick="openImageViewer(${globalIndex}, window.currentTrajectoryScreenshots)" style="cursor: pointer; position: relative;">
                                                    <img src="${s.screenshotUrl}" style="width: 100%; height: 90px; object-fit: cover; border-radius: 6px;">
                                                    <div style="position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.7); color: white; font-size: 9px; padding: 3px; text-align: center;">#${s.screenshotOrder}</div>
                                                </div>`;
                                        }).join('')}
                                    </div>
                                </div>`;
                        }

                        detailHTML += `</div>`;
                    });

                    detailHTML += `
                        <div style="text-align: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid #e9ecef;">
                            <button onclick="window.location.href='/caseapp/track/compositeTrace?id=${composite.id}'"
                                    style="padding: 10px 30px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);">
                                <i class="fa fa-film"></i> 查看完整事件还原
                            </button>
                        </div>
                    </div>`;
                    document.getElementById('eventDetailContent').innerHTML = detailHTML;
                } else {
                    // 处理业务错误
                    document.getElementById('eventDetailContent').innerHTML = `
                        <div style="text-align: center; padding: 40px;">
                            <i class="fa fa-exclamation-circle" style="font-size: 48px; color: #ff6b6b; margin-bottom: 15px;"></i>
                            <p style="color: #666; font-size: 16px; margin-bottom: 10px;">加载失败</p>
                            <p style="color: #999; font-size: 14px;">${data.msg || '未知错误'}</p>
                            <button onclick="closeEventDetailModal()" style="margin-top: 20px; padding: 8px 20px; background: #2a5298; color: white; border: none; border-radius: 4px; cursor: pointer;">关闭</button>
                        </div>`;
                }
            })
            .catch(error => {
                clearTimeout(timeoutId);
                console.error('获取轨迹详情失败:', error);

                let errorMessage = '加载失败，请稍后重试';
                if (error.name === 'AbortError') {
                    errorMessage = '请求超时，请检查网络连接';
                } else if (error.message) {
                    errorMessage = error.message;
                }

                // 显示错误信息
                document.getElementById('eventDetailContent').innerHTML = `
                    <div style="text-align: center; padding: 40px;">
                        <i class="fa fa-exclamation-circle" style="font-size: 48px; color: #ff6b6b; margin-bottom: 15px;"></i>
                        <p style="color: #666; font-size: 16px; margin-bottom: 10px;">加载失败</p>
                        <p style="color: #999; font-size: 14px;">${errorMessage}</p>
                        <button onclick="viewEventDetail('${eventId}')" style="margin-top: 20px; padding: 8px 20px; background: #2a5298; color: white; border: none; border-radius: 4px; cursor: pointer; margin-right: 10px;">
                            <i class="fa fa-refresh"></i> 重试
                        </button>
                        <button onclick="closeEventDetailModal()" style="margin-top: 20px; padding: 8px 20px; background: #999; color: white; border: none; border-radius: 4px; cursor: pointer;">关闭</button>
                    </div>`;
            });
    }

    function closeEventDetailModal() {
        const video = document.getElementById('trajectoryVideo');
        if (video) { video.pause(); video.currentTime = 0; }
        document.getElementById('eventDetailModal').style.display = 'none';
    }

    function openImageViewer(index, screenshots) {
        currentImageIndex = index;
        currentScreenshots = screenshots;
        updateImageViewer();
        document.getElementById('imageViewerModal').style.display = 'flex';
    }

    function updateImageViewer() {
        if (currentScreenshots.length === 0) return;
        const s = currentScreenshots[currentImageIndex];
        document.getElementById('viewerImage').src = s.screenshotUrl;
        document.getElementById('imageCounter').textContent = `${currentImageIndex + 1} / ${currentScreenshots.length}`;
        document.getElementById('imageInfo').textContent = `第 ${s.screenshotOrder} 次检测`;
        document.getElementById('imageTime').textContent = formatTime(s.screenshotTime);
        document.getElementById('prevImageBtn').style.display = currentScreenshots.length > 1 ? 'block' : 'none';
        document.getElementById('nextImageBtn').style.display = currentScreenshots.length > 1 ? 'block' : 'none';
    }

    function navigateImage(dir) {
        currentImageIndex += dir;
        if (currentImageIndex < 0) currentImageIndex = currentScreenshots.length - 1;
        if (currentImageIndex >= currentScreenshots.length) currentImageIndex = 0;
        updateImageViewer();
    }

    function closeImageViewer() {
        document.getElementById('imageViewerModal').style.display = 'none';
    }

    function goToCompositeEvents() { window.location.href = '/caseapp/track'; }
    function goToDailyReport() { window.location.href = '/caseapp/track/dailyReport'; }
    function goToShelfTrajectory() { window.location.href = '/caseapp/track/shelfTrajectory'; }

    function applyFilters() {
        const beginDateFilter = document.getElementById('beginDateFilter').value;
        const endDateFilter = document.getElementById('endDateFilter').value;
        currentFilters.beginDateFilter = beginDateFilter;
        currentFilters.endDateFilter = endDateFilter;
        currentFilters.areaFilter = $('#areaFilter').val();
        currentFilters.statusFilter = $('#statusFilter').val();
        currentFilters.personFilter = $('#personFilter').val() || [];
        currentFilters.specialFilter = $('#specialFilter').val() || [];
        changePage(1);
    }

    function resetFilters() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('beginDateFilter').value = today;
        document.getElementById('endDateFilter').value = today;
        $('#areaFilter').val('').trigger('change');
        $('#statusFilter').val('').trigger('change');
        $('#personFilter').val(null).trigger('change');
        $('#specialFilter').val(null).trigger('change');

        currentFilters = {
            beginDateFilter: today, endDateFilter: today,
            areaFilter: '', statusFilter: '', personFilter: [], specialFilter: []
        };
        changePage(1);
    }

    window.addEventListener('DOMContentLoaded', init);
</script>
<th:block th:include="include :: footer" />
<th:block th:include="include :: select2-js" />
<th:block th:include="include :: bootstrap-select-js" />

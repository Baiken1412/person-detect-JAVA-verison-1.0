<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>事件标注</title>
    <th:block th:include="include :: select2-css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .close-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            font-size: 24px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.3s;
        }

        .close-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .content {
            padding: 20px 30px;
        }

        .video-container {
            width: 100%;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .video-container video {
            width: 100%;
            height: auto;
            display: block;
        }

        .event-details {
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
        }

        .detail-row {
            display: flex;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            width: 120px;
            font-weight: bold;
            color: #666;
            font-size: 14px;
        }

        .detail-value {
            flex: 1;
            color: #333;
            font-size: 14px;
        }

        .reason-form {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 6px;
        }

        .form-section {
            margin-bottom: 20px;
        }

        .form-section:last-child {
            margin-bottom: 0;
        }

        .form-section h3 {
            margin-bottom: 12px;
            color: #333;
            font-size: 16px;
            display: flex;
            align-items: center;
        }

        .form-section h3::before {
            content: '';
            width: 3px;
            height: 18px;
            background: #2a5298;
            margin-right: 10px;
        }

        .reason-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 12px;
        }

        .reason-option {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .reason-option:hover {
            border-color: #2a5298;
        }

        .reason-option input[type="radio"] {
            margin-right: 8px;
            width: 16px;
            height: 16px;
        }

        .reason-option span {
            font-size: 14px;
        }

        .reason-option.selected {
            border-color: #2a5298;
            background: #e7f5ff;
        }

        .person-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .person-tag {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .person-tag:hover {
            border-color: #2a5298;
        }

        .person-tag input[type="checkbox"] {
            margin-right: 6px;
            width: 16px;
            height: 16px;
        }

        .person-tag.selected {
            border-color: #2a5298;
            background: #e7f5ff;
            font-weight: bold;
        }

        .add-person-area {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .add-person-area input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .manual-persons-area {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .manual-persons-area h4 {
            margin-bottom: 10px;
            color: #666;
            font-size: 14px;
        }

        .manual-persons-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .person-tag.manual-person {
            background: #fff5e6;
            border-color: #ffa94d;
        }

        .person-tag.manual-person.selected {
            background: #ffe8cc;
            border-color: #ff8c00;
        }

        .remove-person {
            margin-left: 5px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 2px 6px;
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
        }

        .remove-person:hover {
            background: #ff5252;
        }

        .add-person-btn {
            padding: 8px 16px;
            background: #51cf66;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
        }

        .add-person-btn:hover {
            background: #40c057;
        }

        .other-input {
            display: none;
            margin-top: 10px;
        }

        .other-input.active {
            display: block;
        }

        .other-input textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            min-height: 80px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .submit-btn:hover {
            background: #1e3c72;
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .back-btn {
            padding: 10px 20px;
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 20px;
            transition: background 0.3s;
        }

        .back-btn:hover {
            background: #1e3c72;
        }
    </style>
</head>
<body>
    <button class="back-btn" onclick="goBack()">🔙 返回</button>
    
    <div class="container">
        <div class="header">
            <h1>事件标注</h1>
            <button class="close-btn" onclick="goBack()">✖️</button>
        </div>
        <div class="content">
            <!-- 视频播放器 -->
            <div class="video-container">
                <video id="eventVideo" controls>
                    <source src="" type="video/mp4">
                    您的浏览器不支持视频播放。
                </video>
            </div>

            <!-- 事件详细信息 -->
            <div class="event-details">
                <div class="detail-row">
                    <div class="detail-label">🆔 事件ID：</div>
                    <div class="detail-value" id="detailId">-</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">🕐 发生时间：</div>
                    <div class="detail-value" id="detailTime">-</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">🕑 结束时间：</div>
                    <div class="detail-value" id="detailEndTime">-</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">📍 区域/摄像头：</div>
                    <div class="detail-value" id="detailArea">-</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">⏱️ 视频时长：</div>
                    <div class="detail-value" id="detailDuration">-</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">🏷️ 标注状态：</div>
                    <div class="detail-value" id="detailStatus">-</div>
                </div>
            </div>

            <!-- 原因标注表单 -->
            <div class="reason-form" id="reasonForm">
                <!-- 人员选择 -->
                <div class="form-section">
                    <h3>👥 画面中人员（可多选）</h3>
                    <div class="person-options" id="personOptions">
                        <!-- 人员标签将通过JavaScript动态生成 -->
                    </div>
                    <div class="add-person-area">
                        <input type="text" id="newPersonName" placeholder="补充其他人员姓名...">
                        <button class="add-person-btn" onclick="addPerson()">➕ 添加</button>
                    </div>
                </div>

                <!-- 行为原因 -->
                <div class="form-section">
                    <h3>📝 行为原因（必填）</h3>
                    <div class="reason-options">
                        <label class="reason-option">
                            <input type="radio" name="reason" value="入库物品">
                            <span>入库物品</span>
                        </label>
                        <label class="reason-option">
                            <input type="radio" name="reason" value="出库物品">
                            <span>出库物品</span>
                        </label>
                        <label class="reason-option">
                            <input type="radio" name="reason" value="巡检">
                            <span>巡检</span>
                        </label>
                        <label class="reason-option">
                            <input type="radio" name="reason" value="盘库">
                            <span>盘库</span>
                        </label>
                        <label class="reason-option">
                            <input type="radio" name="reason" value="其他">
                            <span>其他</span>
                        </label>
                    </div>
                    <div class="other-input" id="otherInput">
                        <textarea id="otherDescription" placeholder="请详细说明进入库区的原因..."></textarea>
                    </div>
                </div>

                <button class="submit-btn" id="submitBtn" onclick="submitReason()">✅ 提交标注</button>
            </div>
        </div>
    </div>

    <script>
        let personList = []; // 管理员列表
        let manualPersons = []; // 手动填写的外来人员列表
        let selectedPersons = []; // 当前选中的人员（包括勾选和手动填写的）
        let currentEvent = null;
        let eventId = null;

        // 从URL参数获取事件ID
        function getUrlParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // 初始化页面
        function init() {
            eventId = getUrlParam('id');
            if (!eventId) {
                $.modal.alertError('缺少事件ID参数');
                goBack();
                return;
            }
            loadPersonList();
            loadEventDetail(eventId);
            setupEventListeners();
        }

        // 加载人员列表
        function loadPersonList() {
            fetch('/caseapp/person/persons', {
                method: 'POST'
            })
                .then(response => response.json())
                .then(data => {
                    if (data.code === 0 && data.data) {
                        personList = data.data;
                        renderPersonOptions();
                    }
                })
                .catch(error => {
                    console.error('获取人员列表失败:', error);
                });
        }

        // 加载事件详情（复合事件）
        function loadEventDetail(id) {
            // 查询复合事件列表，找到匹配的复合事件
            const formData = new FormData();
            fetch('/caseapp/track/compositeEvents/list', {
                method: 'POST',
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    if (data.code === 0 && data.data && data.data.length > 0) {
                        // 从复合事件列表中找到匹配的事件
                        const compositeEvent = data.data.find(event =>
                            event.eventId == id || event.id == id
                        );

                        if (!compositeEvent) {
                            $.modal.alertError('未找到ID为 ' + id + ' 的复合事件');
                            goBack();
                            return;
                        }

                        const item = compositeEvent;
                        // 使用第一个轨迹的信息作为展示
                        const firstTrack = item.events && item.events.length > 0 ? item.events[0] : {};

                        currentEvent = {
                            id: item.eventId,  // 使用复合事件的eventId
                            time: formatDateTime(item.startTime),
                            endTime: formatDateTime(item.endTime),
                            area: item.qymc || (item.pathAreas ? item.pathAreas.split(',')[0] : ''),
                            videoUrl: firstTrack.spdz || '',
                            status: item.bzzt === '1' ? 'labeled' : 'unlabeled',
                            reason: item.xwyy || '',
                            reasonDetail: '',
                            persons: [],
                            operator: '',
                            operateTime: '',
                            spsc: item.duration ? (item.duration * 60) : '',  // 转换为秒
                            pstp: firstTrack.pstp || ''
                        };
                        
                        // 解析人员信息
                        const ryxmList = item.ryxm ? item.ryxm.split(',').filter(p => p && p.trim()) : [];
                        const wlryList = item.wlry ? item.wlry.split(',').filter(p => p && p.trim()) : [];
                        
                        currentEvent.ryxmList = ryxmList;
                        currentEvent.wlryList = wlryList;
                        currentEvent.persons = [...ryxmList, ...wlryList];
                        
                        // 解析原因详情
                        if (item.xwyy && item.xwyy.includes('：')) {
                            const parts = item.xwyy.split('：', 2);
                            currentEvent.reason = parts[0];
                            currentEvent.reasonDetail = parts[1];
                        } else {
                            currentEvent.reason = item.xwyy || '';
                        }
                        
                        if (item.bzzt === '1') {
                            currentEvent.operator = item.ryxm || '';
                        }

                        // 更新详情信息
                        document.getElementById('detailId').textContent = currentEvent.id;
                        document.getElementById('detailTime').textContent = currentEvent.time;
                        document.getElementById('detailEndTime').textContent = currentEvent.endTime || '-';
                        document.getElementById('detailArea').textContent = currentEvent.area;
                        document.getElementById('detailDuration').textContent = item.spsc || '-';
                        document.getElementById('detailStatus').textContent =
                            currentEvent.status === 'unlabeled' ? '待标注' : `已标注（${currentEvent.operator} ${currentEvent.operateTime}）`;

                        // 设置视频源
                        const video = document.getElementById('eventVideo');
                        if (currentEvent.videoUrl) {
                            video.src = currentEvent.videoUrl;
                        }

                        // 渲染人员选择器
                        renderPersonOptions();

                        // 预选人员和原因
                        selectedPersons = [];
                        manualPersons = [];
                        
                        if (currentEvent.ryxmList && currentEvent.ryxmList.length > 0) {
                            currentEvent.ryxmList.forEach(person => {
                                const trimmedPerson = person.trim();
                                if (trimmedPerson) {
                                    selectedPersons.push(trimmedPerson);
                                }
                            });
                        }
                        
                        if (currentEvent.wlryList && currentEvent.wlryList.length > 0) {
                            currentEvent.wlryList.forEach(person => {
                                const trimmedPerson = person.trim();
                                if (trimmedPerson) {
                                    manualPersons.push(trimmedPerson);
                                }
                            });
                        }
                        
                        updatePersonSelection();
                        updateManualPersonsDisplay();

                        if (currentEvent.status === 'labeled') {
                            const radios = document.querySelectorAll('input[name="reason"]');
                            radios.forEach(radio => {
                                if (radio.value === currentEvent.reason) {
                                    radio.checked = true;
                                    radio.parentElement.classList.add('selected');
                                    if (currentEvent.reason === '其他') {
                                        document.getElementById('otherInput').classList.add('active');
                                        document.getElementById('otherDescription').value = currentEvent.reasonDetail;
                                    }
                                }
                            });
                            document.getElementById('submitBtn').textContent = '重新标注';
                        } else {
                            resetForm();
                            document.getElementById('submitBtn').textContent = '提交标注';
                        }
                    } else {
                        $.modal.alertError('获取事件详情失败：' + (data.msg || '未知错误'));
                        goBack();
                    }
                })
                .catch(error => {
                    console.error('获取事件详情失败:', error);
                    $.modal.alertError('获取事件详情失败，请稍后重试');
                    goBack();
                });
        }

        // 格式化日期时间
        function formatDateTime(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        }

        // 渲染人员选择器
        function renderPersonOptions() {
            const container = document.getElementById('personOptions');
            container.innerHTML = personList.map(person => `
                <label class="person-tag" data-person="${person}">
                    <input type="checkbox" value="${person}" onchange="togglePerson('${person}')">
                    <span>${person}</span>
                </label>
            `).join('');
            updatePersonSelection();
        }

        // 切换人员选择
        function togglePerson(person) {
            const index = selectedPersons.indexOf(person);
            if (index > -1) {
                selectedPersons.splice(index, 1);
            } else {
                selectedPersons.push(person);
            }
            updatePersonSelection();
        }

        // 更新人员选择状态
        function updatePersonSelection() {
            document.querySelectorAll('.person-tag:not(.manual-person)').forEach(tag => {
                const person = tag.getAttribute('data-person');
                const checkbox = tag.querySelector('input[type="checkbox"]');
                if (selectedPersons.includes(person) && personList.includes(person)) {
                    tag.classList.add('selected');
                    if (checkbox) checkbox.checked = true;
                } else {
                    tag.classList.remove('selected');
                    if (checkbox) checkbox.checked = false;
                }
            });
            if (manualPersons.length > 0) {
                updateManualPersonsDisplay();
            }
        }

        // 添加新人员（外来人员）
        function addPerson() {
            const input = document.getElementById('newPersonName');
            const newPerson = input.value.trim();

            if (!newPerson) {
                $.modal.alertWarning('请输入人员姓名！');
                return;
            }

            if (personList.includes(newPerson)) {
                $.modal.alertWarning('该人员已在管理员列表中，请直接勾选！');
                return;
            }

            if (manualPersons.includes(newPerson)) {
                $.modal.alertWarning('该外来人员已添加！');
                return;
            }

            manualPersons.push(newPerson);
            updateManualPersonsDisplay();
            input.value = '';
        }
        
        // 更新手动添加的外来人员显示
        function updateManualPersonsDisplay() {
            const personSection = document.getElementById('personOptions').closest('.form-section');
            if (!personSection) return;
            
            let manualArea = document.getElementById('manualPersonsArea');
            if (!manualArea && manualPersons.length > 0) {
                manualArea = document.createElement('div');
                manualArea.id = 'manualPersonsArea';
                manualArea.className = 'manual-persons-area';
                manualArea.innerHTML = '<h4>外来人员：</h4><div class="manual-persons-list"></div>';
                personSection.appendChild(manualArea);
            } else if (manualArea && manualPersons.length === 0) {
                manualArea.remove();
                return;
            }
            
            if (manualArea && manualPersons.length > 0) {
                const list = manualArea.querySelector('.manual-persons-list');
                list.innerHTML = manualPersons.map(person => `
                    <label class="person-tag manual-person" data-person="${person}">
                        <span>${person}</span>
                        <button class="remove-person" onclick="removeManualPerson('${person}')">✖️</button>
                    </label>
                `).join('');
            }
        }
        
        // 移除手动添加的外来人员
        function removeManualPerson(person) {
            const index = manualPersons.indexOf(person);
            if (index > -1) {
                manualPersons.splice(index, 1);
                updateManualPersonsDisplay();
            }
        }

        // 重置表单
        function resetForm() {
            selectedPersons = [];
            manualPersons = [];
            document.querySelectorAll('input[name="reason"]').forEach(radio => {
                radio.checked = false;
                radio.parentElement.classList.remove('selected');
            });
            document.getElementById('otherInput').classList.remove('active');
            document.getElementById('otherDescription').value = '';
            document.getElementById('newPersonName').value = '';
            updatePersonSelection();
            const manualArea = document.getElementById('manualPersonsArea');
            if (manualArea) {
                manualArea.remove();
            }
        }

        // 提交原因标注
        function submitReason() {
            if (selectedPersons.length === 0 && manualPersons.length === 0) {
                $.modal.alertWarning('请至少选择一个画面中的人员或填写外来人员！');
                return;
            }

            const selectedReason = document.querySelector('input[name="reason"]:checked');
            if (!selectedReason) {
                $.modal.alertWarning('请选择进入库区的原因！');
                return;
            }

            let reasonDetail = '';
            if (selectedReason.value === '其他') {
                const description = document.getElementById('otherDescription').value.trim();
                if (!description) {
                    $.modal.alertWarning('选择"其他"时必须填写详细说明！');
                    return;
                }
                reasonDetail = description;
            }

            const isRelabel = currentEvent && currentEvent.status === 'labeled';
            const confirmMessage = isRelabel ? '确认要重新标注该事件吗？' : '确认要提交标注吗？';

            $.modal.confirm(confirmMessage, function() {
                let ryxm = '';
                let wlry = '';
                
                selectedPersons.forEach(person => {
                    if (personList.includes(person)) {
                        if (ryxm) ryxm += ',';
                        ryxm += person;
                    }
                });
                
                if (manualPersons && manualPersons.length > 0) {
                    manualPersons.forEach(person => {
                        if (wlry) wlry += ',';
                        wlry += person;
                    });
                }

                let xwyy = selectedReason.value;
                if (selectedReason.value === '其他' && reasonDetail) {
                    xwyy = selectedReason.value + '：' + reasonDetail;
                }

                const formData = new FormData();
                formData.append('eventId', eventId);  // 使用复合事件ID
                formData.append('xwyy', xwyy);
                formData.append('ryxm', ryxm || '');
                formData.append('wlry', wlry || '');
                formData.append('remark', '');  // 备注字段，暂时为空

                // 调用复合事件标注接口
                fetch('/caseapp/track/annotateCompositeEvent', {
                    method: 'POST',
                    body: formData
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.code === 0) {
                            // 显示成功提示（不阻塞）
                            $.modal.msgSuccess('标注成功！');
                            // 立即返回事件列表页面并刷新
                            window.location.href = '/caseapp/track/eventList';
                        } else {
                            $.modal.alertError('标注失败：' + (data.msg || '未知错误'));
                        }
                    })
                    .catch(error => {
                        console.error('提交标注失败:', error);
                        $.modal.alertError('提交标注失败，请稍后重试');
                    });
            });
        }

        // 设置事件监听
        function setupEventListeners() {
            document.querySelectorAll('.reason-option').forEach(option => {
                option.addEventListener('click', function() {
                    document.querySelectorAll('.reason-option').forEach(opt => {
                        opt.classList.remove('selected');
                    });
                    this.classList.add('selected');

                    const radio = this.querySelector('input[type="radio"]');
                    radio.checked = true;

                    if (radio.value === '其他') {
                        document.getElementById('otherInput').classList.add('active');
                    } else {
                        document.getElementById('otherInput').classList.remove('active');
                    }
                });
            });

            document.getElementById('newPersonName').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addPerson();
                }
            });
        }

        // 返回上一页
        function goBack() {
            window.history.back();
        }

        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', init);
    </script>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: select2-js" />
</body>
</html>

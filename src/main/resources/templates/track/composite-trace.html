<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>事件经过还原（复合事件）</title>
    <th:block th:include="include :: select2-css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #9775fa 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .close-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            font-size: 24px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.3s;
        }

        .close-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .content {
            padding: 20px 30px;
        }

        .composite-info {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .composite-info-title {
            font-weight: bold;
            color: #9775fa;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .composite-info-detail {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .video-container {
            width: 100%;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .video-container video {
            width: 100%;
            height: auto;
            display: block;
        }

        .video-controls {
            padding: 12px 15px;
            background: linear-gradient(to bottom, #f8f9fa, #e9ecef);
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid #dee2e6;
        }

        .volume-btn {
            background: #9775fa;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .volume-btn:hover {
            background: #764ba2;
        }

        .volume-btn.muted {
            background: #868e96;
        }

        .trace-timeline {
            border-left: 3px solid #9775fa;
            padding-left: 20px;
            margin-top: 20px;
        }

        .trace-node {
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 6px;
            position: relative;
            background: #f8f9fa;
            cursor: pointer;
            transition: all 0.3s;
        }

        .trace-node:hover {
            background: #e7f5ff;
        }

        .trace-node::before {
            content: '';
            position: absolute;
            left: -26px;
            top: 20px;
            width: 16px;
            height: 16px;
            background: #bbb;
            border-radius: 50%;
            border: 3px solid #fff;
            transition: all 0.3s;
        }

        .trace-node.active {
            background: #e7f5ff;
            border-left: 3px solid #9775fa;
            box-shadow: 0 2px 8px rgba(151,117,250,0.2);
        }

        .trace-node.active::before {
            background: #9775fa;
            transform: scale(1.2);
        }

        .trace-time {
            font-weight: bold;
            color: #9775fa;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .trace-area {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }

        .trace-duration {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        .back-btn, .export-btn {
            padding: 10px 20px;
            background: #9775fa;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .back-btn:hover {
            background: #764ba2;
        }

        .export-btn {
            background: #51cf66;
        }

        .export-btn:hover {
            background: #40c057;
        }

        /* 截图轮播样式 */
        .image-carousel {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .carousel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #9775fa;
        }

        .carousel-header h3 {
            font-size: 18px;
            color: #333;
            margin: 0;
        }

        .carousel-counter {
            font-size: 14px;
            color: #666;
            background: #f0f0f0;
            padding: 4px 12px;
            border-radius: 12px;
        }

        .carousel-container {
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        .carousel-btn {
            flex-shrink: 0;
            width: 50px;
            height: 50px;
            background: #9775fa;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(151, 117, 250, 0.3);
        }

        .carousel-btn:hover:not(:disabled) {
            background: #764ba2;
            transform: scale(1.1);
            box-shadow: 0 4px 12px rgba(151, 117, 250, 0.5);
        }

        .carousel-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .carousel-image-wrapper {
            flex: 1;
            position: relative;
            background: #f8f9fa;
            border-radius: 8px;
            overflow: hidden;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-image-wrapper img {
            width: 100%;
            height: auto;
            max-height: 500px;
            object-fit: contain;
            display: block;
        }

        .no-image-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 16px;
            padding: 60px;
        }

        .no-image-placeholder div:first-child {
            font-size: 64px;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        .carousel-image-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            color: white;
            padding: 20px 15px 10px;
            font-size: 14px;
        }

        .carousel-image-info .info-time {
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 15px;
        }

        .carousel-image-info .info-area {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div style="position: fixed; top: 20px; left: 20px; z-index: 1000; display: flex; gap: 10px;">
        <button class="back-btn" onclick="goBack()">🔙 返回</button>
        <button class="export-btn" onclick="exportEventPackage()">📦 导出事件包</button>
    </div>

    <div class="container">
        <div class="header">
            <h1>🎬 事件经过还原（复合事件）</h1>
            <button class="close-btn" onclick="goBack()">✖️</button>
        </div>
        <div class="content">
            <div class="composite-info" id="compositeInfo"></div>
            <div class="video-container">
                <video id="traceVideo" controls muted>
                    <source src="" type="video/mp4">
                    您的浏览器不支持视频播放。
                </video>
                <div class="video-controls">
                    <button class="volume-btn muted" id="volumeBtn" onclick="toggleVolume()">
                        🔇 点击开启声音
                    </button>
                    <span style="color: #666; font-size: 12px;">
                        💡 视频默认静音自动播放，如需声音请点击左侧按钮
                    </span>
                </div>
            </div>

            <!-- 轨迹截图轮播区域 -->
            <div class="image-carousel">
                <div class="carousel-header">
                    <h3>📸 轨迹截图</h3>
                    <span class="carousel-counter" id="imageCounter">1 / 1</span>
                </div>
                <div class="carousel-container">
                    <button class="carousel-btn prev" id="prevImageBtn" onclick="showPrevImage()">
                        ◀
                    </button>
                    <div class="carousel-image-wrapper">
                        <img id="carouselImage" src="" alt="轨迹截图" onerror="this.src=''; this.style.display='none'; document.getElementById('noImagePlaceholder').style.display='flex';">
                        <div id="noImagePlaceholder" class="no-image-placeholder" style="display: none;">
                            <div>📷</div>
                            <p>暂无截图</p>
                        </div>
                        <div class="carousel-image-info" id="imageInfo">
                            <div class="info-time"></div>
                            <div class="info-area"></div>
                        </div>
                    </div>
                    <button class="carousel-btn next" id="nextImageBtn" onclick="showNextImage()">
                        ▶
                    </button>
                </div>
            </div>

            <div class="trace-timeline" id="traceTimeline"></div>
        </div>
    </div>

    <script>
        let currentComposite = null;
        let compositeId = null;
        let currentImageIndex = 0; // 当前显示的截图索引

        // 从URL参数获取复合事件ID
        function getUrlParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // 初始化页面
        function init() {
            compositeId = getUrlParam('id');
            if (!compositeId) {
                $.modal.alertError('缺少复合事件ID参数');
                goBack();
                return;
            }
            loadCompositeEvent(compositeId);
        }

        // 加载复合事件数据
        function loadCompositeEvent(id) {
            // 从URL参数获取时间范围（如果有）
            const beginDate = getUrlParam('beginDate') || new Date().toISOString().split('T')[0];
            const endDate = getUrlParam('endDate') || beginDate;
            
            // 构建时间参数
            const beginDateObj = new Date(beginDate);
            const endDateObj = new Date(endDate);
            
            beginDateObj.setHours(0, 0, 0, 0);
            const beginPssj = beginDateObj.getFullYear() + '-' + 
                String(beginDateObj.getMonth() + 1).padStart(2, '0') + '-' + 
                String(beginDateObj.getDate()).padStart(2, '0') + ' ' +
                String(beginDateObj.getHours()).padStart(2, '0') + ':' +
                String(beginDateObj.getMinutes()).padStart(2, '0') + ':' +
                String(beginDateObj.getSeconds()).padStart(2, '0');
            
            endDateObj.setHours(23, 59, 59, 999);
            const endPssj = endDateObj.getFullYear() + '-' + 
                String(endDateObj.getMonth() + 1).padStart(2, '0') + '-' + 
                String(endDateObj.getDate()).padStart(2, '0') + ' ' +
                String(endDateObj.getHours()).padStart(2, '0') + ':' +
                String(endDateObj.getMinutes()).padStart(2, '0') + ':' +
                String(endDateObj.getSeconds()).padStart(2, '0');
            
            const formData = new FormData();
            formData.append('params[beginPssj]', beginPssj);
            formData.append('params[endPssj]', endPssj);
            
            fetch('/caseapp/track/compositeEvents/list', {
                method: 'POST',
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    if (data.code === 0 && data.data) {
                        // 查找匹配的复合事件
                        const composite = data.data.find((comp, currentIndex) => {
                            // 优先使用主键ID匹配
                            if (comp.id && comp.id == id) {
                                return true;
                            }
                            // 兼容eventId匹配
                            if (comp.eventId && comp.eventId == id) {
                                return true;
                            }
                            // 兼容旧的COMP索引格式（向后兼容）
                            if (id.startsWith('COMP')) {
                                const targetIndex = parseInt(id.replace('COMP', '')) - 1;
                                return currentIndex === targetIndex;
                            }
                            return false;
                        });
                        
                        if (!composite) {
                            $.modal.alertError('未找到指定的复合事件');
                            goBack();
                            return;
                        }
                        
                        // 转换数据格式 - 轨迹基本信息
                        const events = composite.events.map(item => ({
                            id: item.id,
                            time: formatDateTime(item.pssj),
                            endTime: formatDateTime(item.jssj),
                            pssj: item.pssj, // 原始时间，用于判断工作时间
                            jssj: item.jssj, // 结束时间
                            rysl: item.rysl || 0, // 人员数量
                            area: item.qymc || '',
                            videoUrl: item.spdz || '',
                            imageUrl: item.pstp || '', // 第一张截图路径（兼容）
                            screenshots: item.screenshots || [], // 所有截图
                            jscs: item.jscs || 1, // 检测次数
                            status: item.bzzt === '1' ? 'labeled' : 'unlabeled',
                            reason: item.xwyy || '',
                            spsc: item.spsc || ''
                        }));

                        // 将所有轨迹的截图展开成一个平面数组，用于轮播
                        const allScreenshots = [];
                        events.forEach((event, trackIndex) => {
                            if (event.screenshots && event.screenshots.length > 0) {
                                event.screenshots.forEach(screenshot => {
                                    allScreenshots.push({
                                        image: screenshot.screenshotUrl,
                                        time: formatDateTime(screenshot.screenshotTime),
                                        area: event.area,
                                        rysl: event.rysl,
                                        trackIndex: trackIndex,
                                        order: screenshot.screenshotOrder,
                                        trackId: event.id
                                    });
                                });
                            } else if (event.imageUrl) {
                                // 兼容旧数据：如果没有截图记录，使用pstp
                                allScreenshots.push({
                                    image: event.imageUrl,
                                    time: event.time,
                                    area: event.area,
                                    rysl: event.rysl,
                                    trackIndex: trackIndex,
                                    order: 1,
                                    trackId: event.id
                                });
                            }
                        });
                        
                        currentComposite = {
                            id: id,
                            eventId: composite.eventId,
                            events: events,
                            screenshots: allScreenshots, // 所有截图的平面数组
                            startTime: formatDateTime(composite.startTime),
                            endTime: formatDateTime(composite.endTime),
                            path: events.map(e => e.area),
                            eventCount: composite.eventCount,
                            bzzt: String(composite.bzzt || '0'),
                            xwyy: composite.xwyy || '',
                            ryxm: composite.ryxm || '',
                            wlry: composite.wlry || '',
                            remark: composite.remark || ''
                        };

                        // 调试：输出复合事件数据
                        console.log('========== 复合事件数据加载成功 ==========');
                        console.log('复合事件ID:', currentComposite.eventId);
                        console.log('轨迹数量:', currentComposite.events.length);
                        console.log('截图总数:', currentComposite.screenshots.length);
                        console.log('时间范围:', currentComposite.startTime, '~', currentComposite.endTime);
                        console.log('路径:', currentComposite.path.join(' → '));
                        console.log('\n关联轨迹详情:');
                        currentComposite.events.forEach((e, i) => {
                            console.log(`  [${i + 1}] ID=${e.id}, 区域=${e.area}, 时间=${e.time} ~ ${e.endTime}`);
                            console.log(`      截图数: ${e.screenshots.length}, 检测次数: ${e.jscs}`);
                            console.log(`      视频URL: "${e.videoUrl}" (长度: ${e.videoUrl ? e.videoUrl.length : 0})`);
                            console.log(`      状态: ${e.status}, 时长: ${e.spsc}秒`);
                        });
                        console.log('==========================================\n');

                        renderCompositeInfo();
                        renderTraceTimeline();
                        // 初始化时显示第一个轨迹的截图，但不自动播放视频
                        updateCarouselImage(0);
                        highlightTraceNode(0);
                    } else {
                        $.modal.alertError('获取复合事件失败：' + (data.msg || '未知错误'));
                        goBack();
                    }
                })
                .catch(error => {
                    console.error('获取复合事件失败:', error);
                    $.modal.alertError('获取复合事件失败，请稍后重试');
                    goBack();
                });
        }

        // 格式化日期时间
        function formatDateTime(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        }

        // 计算时长
        function calculateDuration(startTime, endTime) {
            const start = new Date(startTime);
            const end = new Date(endTime);
            const diffSeconds = Math.floor((end - start) / 1000); // 秒

            if (diffSeconds < 60) {
                return `${diffSeconds}秒`;
            } else if (diffSeconds < 3600) {
                const mins = Math.floor(diffSeconds / 60);
                const secs = diffSeconds % 60;
                return `${mins}分${secs}秒`;
            } else {
                const hours = Math.floor(diffSeconds / 3600);
                const mins = Math.floor((diffSeconds % 3600) / 60);
                const secs = diffSeconds % 60;
                return `${hours}小时${mins}分${secs}秒`;
            }
        }

        // 渲染复合事件信息
        function renderCompositeInfo() {
            const duration = calculateDuration(currentComposite.startTime, currentComposite.endTime);
            const bzzt = String(currentComposite.bzzt || '0');
            const statusText = bzzt === '1' ? '已标注' : '待标注';
            const statusColor = bzzt === '1' ? '#51cf66' : '#ff6b6b';

            // 构建标注信息
            let annotationHtml = '';
            if (bzzt === '1') {
                annotationHtml = '<div style="margin-top: 12px; padding: 12px; background: #e7f5ff; border-left: 4px solid #4c6ef5; border-radius: 4px;">';
                annotationHtml += '<div style="font-weight: bold; color: #4c6ef5; margin-bottom: 6px;">📋 标注信息</div>';

                if (currentComposite.xwyy) {
                    annotationHtml += `<div style="margin-bottom: 4px;">📝 行为原因：${currentComposite.xwyy}</div>`;
                }
                if (currentComposite.ryxm) {
                    annotationHtml += `<div style="margin-bottom: 4px;">👤 管理员：${currentComposite.ryxm}</div>`;
                }
                if (currentComposite.wlry) {
                    annotationHtml += `<div style="margin-bottom: 4px;">🔶 外来人员：${currentComposite.wlry}</div>`;
                }
                if (currentComposite.remark) {
                    annotationHtml += `<div style="margin-bottom: 4px;">💬 备注：${currentComposite.remark}</div>`;
                }

                annotationHtml += '</div>';
            }

            document.getElementById('compositeInfo').innerHTML = `
                <div class="composite-info-title">
                    复合事件 #${currentComposite.id} - ${currentComposite.eventCount || currentComposite.events.length} 个关联事件
                    <span style="background: ${statusColor}; color: white; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-left: 8px;">${statusText}</span>
                </div>
                <div class="composite-info-detail">
                    📍 路径：${currentComposite.path.join(' → ')}<br>
                    ⏱️ 时长：${duration}<br>
                    📅 时间范围：${currentComposite.startTime} ~ ${currentComposite.endTime.split(' ')[1]}
                </div>
                ${annotationHtml}
            `;
        }

        // 渲染追踪时间线
        function renderTraceTimeline() {
            document.getElementById('traceTimeline').innerHTML =
                currentComposite.events.map((e, i) => {
                    const prevEvent = i > 0 ? currentComposite.events[i - 1] : null;
                    const duration = prevEvent ? calculateDuration(prevEvent.time, e.time) : '';

                    // 检查是否非工作时间（工作时间为9:00-17:00）
                    let isNonWorktime = false;
                    if (e.pssj) {
                        const eventTime = new Date(e.pssj);
                        const hour = eventTime.getHours();
                        isNonWorktime = (hour < 9 || hour >= 17);
                    }

                    // 检查人员异常（<2人或≥3人）
                    const isAbnormalPerson = e.rysl > 0 && (e.rysl < 2 || e.rysl >= 3);

                    // 生成警告标签
                    const warningTags = [];
                    if (isNonWorktime) {
                        warningTags.push('<span style="background: #ff9800; color: white; padding: 2px 6px; border-radius: 8px; font-size: 10px; margin-left: 4px;">⚠️ 非工作时间</span>');
                    }
                    if (isAbnormalPerson) {
                        warningTags.push('<span style="background: #e74c3c; color: white; padding: 2px 6px; border-radius: 8px; font-size: 10px; margin-left: 4px;">⚠️ 人数异常</span>');
                    }

                    return `
                        <div class="trace-node ${i === 0 ? 'active' : ''}" id="traceNode${i}" onclick="playTraceVideo(${i}, true)">
                            ${duration ? `<div class="trace-duration">⏱️ 间隔 ${duration}</div>` : ''}
                            <div class="trace-time">${e.time}</div>
                            <div class="trace-area">📍 ${e.area} ${e.rysl ? `(${e.rysl}人)` : ''}${warningTags.join('')}</div>
                        </div>
                    `;
                }).join('');
        }

        // // 播放追踪视频
        // function playTraceVideo(index) {
        //     if (index >= currentComposite.events.length) return;

        //     const v = document.getElementById('traceVideo');
        //     highlightTraceNode(index);
        //     v.src = currentComposite.events[index].videoUrl || '';

        //     if (v.src) {
        //         v.play();
        //         v.onended = () => {
        //             if (index + 1 < currentComposite.events.length) {
        //                 setTimeout(() => playTraceVideo(index + 1), 500);
        //             }
        //         };
        //     } else {
        //         if (index + 1 < currentComposite.events.length) {
        //             setTimeout(() => playTraceVideo(index + 1), 1000);
        //         }
        //     }
        // }

        // 播放追踪视频
        function playTraceVideo(index, manualTrigger = false) {
            if (index >= currentComposite.events.length) return;

            const v = document.getElementById('traceVideo');
            highlightTraceNode(index);
            // 只有手动点击时才更新截图显示
            if (manualTrigger) {
                // 找到该轨迹的第一张截图在平面数组中的实际索引
                const firstScreenshotIndex = currentComposite.screenshots.findIndex(
                    screenshot => screenshot.trackIndex === index
                );
                if (firstScreenshotIndex !== -1) {
                    updateCarouselImage(firstScreenshotIndex);
                }
            }

            // 获取原始 URL 字符串
            const url = currentComposite.events[index].videoUrl;
            const event = currentComposite.events[index];

            console.log(`[视频播放] 第 ${index + 1}/${currentComposite.events.length} 个事件`);
            console.log(`  事件ID: ${event.id}`);
            console.log(`  区域: ${event.area}`);
            console.log(`  时间: ${event.time}`);
            console.log(`  视频URL: "${url}"`);
            console.log(`  URL类型: ${typeof url}, 长度: ${url ? url.length : 0}`);

            // 只有当 URL 真实存在且不为空时才设置 src
            if (url && url.trim() !== '') {
                console.log(`  → 设置视频源: ${url}`);
                v.src = url;

                // 确保视频静音（允许自动播放）
                v.muted = true;

                // 添加加载失败监听
                v.onerror = (e) => {
                    console.error(`  ✗ 视频加载失败:`, e);
                    console.error(`  ✗ 视频URL: "${url}"`);
                    console.error(`  ✗ URL长度: ${url.length}`);
                    console.error(`  ✗ 可能原因: 文件不存在、格式不支持或路径错误`);

                    // 构建错误消息
                    let errorMsg = `❌ 视频加载失败！\n\n`;
                    errorMsg += `📍 事件信息：\n`;
                    errorMsg += `   • 事件ID: ${event.id}\n`;
                    errorMsg += `   • 区域: ${event.area}\n`;
                    errorMsg += `   • 时间: ${event.time}\n\n`;
                    errorMsg += `📂 视频路径：\n`;
                    errorMsg += `   ${url}\n\n`;
                    errorMsg += `🔧 可能的原因：\n`;
                    errorMsg += `   1. 视频文件不存在（路径错误或文件未上传）\n`;
                    errorMsg += `   2. 视频格式不支持（需要MP4格式）\n`;
                    errorMsg += `   3. 数据库中spdz字段为空或无效\n`;
                    errorMsg += `   4. 服务器路径配置问题\n\n`;
                    errorMsg += `💡 建议：\n`;
                    errorMsg += `   请检查数据库中该事件的spdz字段值是否正确`;

                    console.error(`\n${'='.repeat(60)}`);
                    console.error(`视频加载失败详情：`);
                    console.error(errorMsg);
                    console.error(`${'='.repeat(60)}\n`);

                    // 只在第一次失败时显示弹窗，避免连续多个弹窗
                    if (index === 0) {
                        alert(errorMsg);
                    }

                    // 已移除自动跳到下一个视频的功能
                };

                // 添加 catch 捕获播放错误
                v.play().catch(e => {
                    console.error(`  ✗ 播放出错:`, e);
                    console.error(`  ✗ 错误类型: ${e.name}`);
                    console.error(`  ✗ 错误详情: ${e.message}`);

                    // 如果是自动播放被阻止的错误，尝试静音后再播放
                    if (e.name === 'NotAllowedError') {
                        console.log(`  → 尝试静音播放...`);
                        v.muted = true;
                        v.play().catch(err => {
                            console.error(`  ✗ 静音播放也失败:`, err);
                            // 已移除自动跳到下一个视频的功能
                        });
                    } else {
                        // 已移除自动跳到下一个视频的功能
                        console.error(`  ✗ 视频播放失败，请手动点击其他轨迹节点`);
                    }
                });

                v.onended = () => {
                    console.log(`  ✓ 视频播放完成`);
                    // 已移除自动播放下一个视频的功能
                    // 用户需要手动点击下一个轨迹节点来播放
                };
            } else {
                // 如果没有视频地址，移除 src 属性防止报错
                v.removeAttribute('src');
                console.warn(`  ⚠ 第 ${index + 1} 个节点无视频地址`);
                // 已移除自动跳到下一个视频的功能
            }
        }

        // 高亮追踪节点
        function highlightTraceNode(index) {
            document.querySelectorAll('.trace-node').forEach(n => n.classList.remove('active'));
            const node = document.getElementById('traceNode' + index);
            if (node) {
                node.classList.add('active');
                node.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        // 切换音量
        function toggleVolume() {
            const v = document.getElementById('traceVideo');
            const btn = document.getElementById('volumeBtn');

            if (v.muted) {
                v.muted = false;
                btn.classList.remove('muted');
                btn.innerHTML = '🔊 声音已开启';
                console.log('✓ 声音已开启');
            } else {
                v.muted = true;
                btn.classList.add('muted');
                btn.innerHTML = '🔇 点击开启声音';
                console.log('✓ 声音已关闭');
            }
        }

        // 监听视频音量变化（当用户通过视频控制条切换静音时同步按钮状态）
        document.addEventListener('DOMContentLoaded', () => {
            const v = document.getElementById('traceVideo');
            const btn = document.getElementById('volumeBtn');

            v.addEventListener('volumechange', () => {
                if (v.muted) {
                    btn.classList.add('muted');
                    btn.innerHTML = '🔇 点击开启声音';
                } else {
                    btn.classList.remove('muted');
                    btn.innerHTML = '🔊 声音已开启';
                }
            });
        });

        // 返回上一页
        function goBack() {
            window.history.back();
        }

        // 导出事件包
        function exportEventPackage() {
            if (!compositeId) {
                $.modal.alertError('无法获取事件ID');
                return;
            }

            $.modal.loading("正在导出事件包，请稍候...");

            fetch('/caseapp/track/compositeEvents/export/' + compositeId, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                $.modal.closeLoading();
                if (data.code === 0) {
                    // 下载ZIP文件（和台账导出一样）
                    const fileName = encodeURI(data.msg);
                    window.location.href = ctx + 'common/download?fileName=' + fileName + '&delete=true';
                    $.modal.msgSuccess('导出成功！正在下载事件包...');
                } else {
                    $.modal.alertError('导出失败：' + (data.msg || '未知错误'));
                }
            })
            .catch(error => {
                $.modal.closeLoading();
                console.error('导出事件包失败:', error);
                $.modal.alertError('导出失败，请稍后重试');
            });
        }

        // ===== 截图轮播功能 =====

        // 更新截图显示 - 使用所有截图的平面数组
        function updateCarouselImage(index) {
            if (!currentComposite || !currentComposite.screenshots || currentComposite.screenshots.length === 0) {
                return;
            }

            currentImageIndex = index;
            const screenshot = currentComposite.screenshots[index];
            const img = document.getElementById('carouselImage');
            const placeholder = document.getElementById('noImagePlaceholder');
            const counter = document.getElementById('imageCounter');
            const imageInfo = document.getElementById('imageInfo');
            const prevBtn = document.getElementById('prevImageBtn');
            const nextBtn = document.getElementById('nextImageBtn');

            // 更新计数器 - 显示总截图数
            counter.textContent = `${index + 1} / ${currentComposite.screenshots.length}`;

            // 更新按钮状态
            prevBtn.disabled = (index === 0);
            nextBtn.disabled = (index === currentComposite.screenshots.length - 1);

            // 更新图片信息 - 显示检测顺序
            imageInfo.querySelector('.info-time').textContent = `🕐 ${screenshot.time}`;
            imageInfo.querySelector('.info-area').textContent = `📍 ${screenshot.area}${screenshot.rysl ? ` (${screenshot.rysl}人)` : ''} [第${screenshot.order}次检测]`;

            // 更新图片
            if (screenshot.image && screenshot.image.trim() !== '') {
                img.src = screenshot.image;
                img.style.display = 'block';
                placeholder.style.display = 'none';
                console.log(`显示截图 ${index + 1}/${currentComposite.screenshots.length}: 第${screenshot.order}次检测, ${screenshot.image}`);
            } else {
                img.style.display = 'none';
                placeholder.style.display = 'flex';
                console.log(`第 ${index + 1} 张截图无图片`);
            }

            // 同步高亮对应的轨迹节点
            if (screenshot.trackIndex !== undefined) {
                highlightTraceNode(screenshot.trackIndex);
            }
        }

        // 显示上一张截图
        function showPrevImage() {
            if (currentImageIndex > 0) {
                updateCarouselImage(currentImageIndex - 1);
            }
        }

        // 显示下一张截图
        function showNextImage() {
            if (currentComposite && currentImageIndex < currentComposite.screenshots.length - 1) {
                updateCarouselImage(currentImageIndex + 1);
            }
        }

        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', init);
    </script>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: select2-js" />
</body>
</html>
